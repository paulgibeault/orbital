<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04050b">
<title>Orbital Courier</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<!-- Paul's Arcade SDK (root-relative, served by the launcher origin). Absent under `node server.js`,
     where the game falls back to plain localStorage. Arcade.init runs at the top of the game script. -->
<script src="/arcade-sdk.js"></script>
<style>
  :root{
    --bg:#04050b; --panel:rgba(12,16,34,.64); --brd:rgba(150,175,255,.16); --ink:#e3ebff; --dim:#8c9cc6; --faint:rgba(220,230,255,.08);
    --accent:#ffd28a; --accent2:#7fc8ff; --good:#9dffb5; --warn:#ffb36b; --bad:#ff9c9c; --glow:rgba(127,200,255,.25);
    --font:"Avenir Next","SF Pro Display",-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  body[data-theme=blueprint]{ --bg:#071a36; --panel:rgba(6,28,62,.72); --brd:rgba(140,205,255,.38); --ink:#eef7ff; --dim:#94bde6;
    --accent:#ffffff; --accent2:#7fe6ff; --glow:rgba(127,230,255,.25); --faint:rgba(140,205,255,.1); }
  body[data-theme=amber]{ --bg:#0c0703; --panel:rgba(32,19,6,.74); --brd:rgba(255,176,70,.3); --ink:#ffe2b0; --dim:#c3925a;
    --accent:#ffb347; --accent2:#ffd27a; --good:#d6ff9a; --warn:#ff9a4a; --glow:rgba(255,176,70,.22); --faint:rgba(255,176,70,.08);
    --font:"SF Mono",ui-monospace,Menlo,monospace; }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
  canvas{display:block;cursor:crosshair}
  b{color:var(--accent);font-weight:600}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--brd);border-radius:16px;pointer-events:none;
    backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%);
    box-shadow:0 10px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px rgba(0,0,0,.25)}
  .panel::before{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
    background:linear-gradient(135deg,var(--glow),transparent 35%);opacity:.5}
  .hdr{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
  .hdr i{font-style:normal;color:var(--accent2)}
  #mission{left:18px;top:18px;width:340px;padding:14px 16px 12px}
  #instr{left:18px;bottom:18px;width:340px;padding:12px 16px 12px}
  #keys{right:18px;top:18px;width:270px;padding:12px 14px;font-size:12px;line-height:1.75}
  #coach{left:50%;bottom:20px;transform:translateX(-50%);padding:10px 20px;font-size:14px;max-width:min(620px,48vw);text-align:center;line-height:1.45;transition:opacity .3s}
  #combo{left:50%;bottom:104px;transform:translateX(-50%);padding:6px 16px 8px;text-align:center;display:none;min-width:150px}
  #combo .m{font:800 26px var(--mono);color:var(--warn);text-shadow:0 0 16px rgba(255,179,107,.5)}
  #combo .h{font-size:11px;color:var(--dim);letter-spacing:.15em}
  #combo .bar{margin-top:4px}
  .warpnum{font-size:24px;font-weight:800;color:var(--accent2);font-family:var(--mono);margin:0 10px 0 4px;vertical-align:-3px;text-shadow:0 0 14px var(--glow)}
  #coach .tag{font-size:10px;letter-spacing:.2em;color:var(--accent2);display:block;margin-bottom:2px}
  #toasts{position:fixed;left:50%;top:18px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:5}
  .toast{padding:7px 16px;border-radius:99px;font-weight:600;font-size:14px;background:var(--panel);border:1px solid var(--brd);
    backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.4);animation:toast 2.8s ease forwards}
  .toast.gain{color:var(--warn);border-color:rgba(255,179,107,.5)} .toast.lose{color:var(--accent2);border-color:rgba(127,200,255,.5)}
  .toast.good{color:var(--good);border-color:rgba(157,255,181,.5)} .toast.bad{color:var(--bad)}
  @keyframes toast{0%{opacity:0;transform:translateY(-8px) scale(.96)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
  .title{font-size:19px;font-weight:700;letter-spacing:.02em;margin:0 0 2px}
  .sub{font-size:12px;color:var(--dim)}
  .route{display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0 8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--faint);border:1px solid var(--brd);font-weight:600}
  .chip.now{border-color:var(--accent);box-shadow:0 0 12px var(--glow)}
  .chip .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 6px currentColor}
  .arrow{color:var(--dim)}
  .pips{display:flex;gap:5px;margin:8px 0 4px}
  .pips span{flex:1;height:6px;border-radius:3px;background:var(--faint)} .pips span.on{background:linear-gradient(90deg,var(--accent2),var(--accent))}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);margin:4px 0}
  .row b,.num{color:var(--ink);font-family:var(--mono);font-weight:500}
  .bar{height:5px;border-radius:3px;background:var(--faint);overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:3px}
  .stars{color:var(--accent);letter-spacing:1px;font-size:13px}
  .gauge{position:relative;height:30px;margin:8px 0 4px}
  .gauge .track{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:var(--faint)}
  .gauge .band{position:absolute;top:10px;height:10px;border-radius:5px;background:linear-gradient(90deg,rgba(127,200,255,.55),rgba(127,200,255,.9));box-shadow:0 0 10px var(--glow)}
  .gauge .tgt{position:absolute;top:6px;height:18px;border-radius:4px;background:rgba(255,210,138,.25);border:1px solid var(--accent)}
  .gauge .tick{position:absolute;top:-2px;font-size:9.5px;color:var(--dim);transform:translateX(-50%);font-family:var(--mono);white-space:nowrap}
  .gauge{margin:12px 8px 8px}
  .gauge .tick.lo{top:23px}
  .gauge + .row{margin-top:14px}
  .ok{color:var(--good)!important} .warn{color:var(--warn)!important} .bad{color:var(--bad)!important}
  kbd{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--faint);border:1px solid var(--brd);border-bottom-width:2px;color:var(--ink);white-space:nowrap}
  #keys .k{display:flex;justify-content:space-between;gap:10px} #keys .k span:last-child{color:var(--dim);text-align:right}
  #keys .sep{height:1px;background:var(--brd);margin:6px 0}
  #done{left:50%;top:46%;transform:translate(-50%,-50%);width:min(760px,86vw);padding:26px 30px;font-size:14px;line-height:1.6;display:none;z-index:10}
  #done h2{margin:0 0 4px;font-size:24px;letter-spacing:.03em} #done .lede{color:var(--dim);margin-bottom:12px}
  #done .cols{display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:center}
  #done svg{width:100%;height:auto;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--brd)}
  #done .foot{margin-top:14px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
  #done .dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin:0 3px} #done .dots span.on{background:var(--accent)}
  #done ul{margin:6px 0;padding-left:18px} #done li{margin:3px 0}
  #log{position:fixed;right:22px;bottom:6px;font-size:10px;color:var(--dim);opacity:.6;font-family:var(--mono);pointer-events:none}
  .hide{display:none!important}
  #done svg .o{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:3 4;opacity:.75}
  #done svg .o2{fill:none;stroke:var(--accent);stroke-width:1.4;opacity:.8}
  #done svg .p{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
  #done svg .pk{fill:none;stroke:var(--accent2);stroke-width:2;stroke-dasharray:6 5}
  #done svg .gd{fill:none;stroke:var(--good);stroke-width:1.6;stroke-dasharray:4 4}
  #done svg .bd{fill:none;stroke:var(--bad);stroke-width:1.6;opacity:.7}
  #done svg .sun{fill:#ffb066;filter:drop-shadow(0 0 6px #ff9a40)} #done svg .pl{fill:var(--accent2)} #done svg .tg{fill:var(--accent)}
  #done svg .gas{fill:#d9a066} #done svg .me{fill:#fff} #done svg .ah{fill:var(--warn)} #done svg .ah2{fill:var(--accent2)}
  #done svg .w{stroke:var(--warn);stroke-width:2.4;fill:none} #done svg .g2{stroke:var(--accent2);stroke-width:2;fill:none}
  #done svg text{fill:var(--ink);font:10.5px var(--mono)} #done svg .dim{fill:var(--dim)} #done svg .acc{fill:var(--accent)} #done svg .ok{fill:var(--good)}
  #done svg .warnt{fill:var(--warn)}
  /* Launcher font-scale preference (the SDK sets --font-scale on <html>; 1 when standalone). */
  .panel,#toasts{zoom:var(--font-scale,1)}
  /* ---- touch controls (body.touch is set on the first touch, cleared by a real keypress) ---- */
  #touch{display:none}
  body.touch{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body.touch #touch{display:block}
  body.touch canvas{cursor:default;touch-action:none}
  body.touch #keys,body.touch.instr-off #instr{display:none}
  .tb{position:fixed;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font:700 12px var(--font);letter-spacing:.08em;color:var(--ink);background:var(--panel);border:1px solid var(--brd);
    border-radius:50%;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);touch-action:none;-webkit-tap-highlight-color:transparent;
    box-shadow:0 6px 20px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);padding:0;opacity:.88}
  .tb.held{background:var(--glow);border-color:var(--accent2);transform:scale(.94);opacity:1}
  #tbGo{right:calc(22px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:96px;height:96px;font-size:30px;color:var(--accent);border-color:var(--accent)}
  #tbGo span{font-size:12px;letter-spacing:.14em;color:var(--ink)}
  #tbGear{right:calc(128px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:66px;height:66px;font-size:11px}
  #tbWarp{right:calc(112px + env(safe-area-inset-right));bottom:calc(100px + env(safe-area-inset-bottom));width:58px;height:58px;font-size:11px;color:var(--accent2)}
  #tbTgt{right:calc(34px + env(safe-area-inset-right));bottom:calc(134px + env(safe-area-inset-bottom));width:52px;height:52px;font-size:9px}
  #tbCancel{right:calc(198px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));width:46px;height:46px;font-size:18px;color:var(--bad);display:none}
  body.can-cancel #tbCancel{display:flex}
  /* left-handed (launcher setting): buttons on the left, stick on the right */
  body.lefty #tbGo{right:auto;left:calc(22px + env(safe-area-inset-left))}
  body.lefty #tbGear{right:auto;left:calc(128px + env(safe-area-inset-left))}
  body.lefty #tbWarp{right:auto;left:calc(112px + env(safe-area-inset-left))}
  body.lefty #tbTgt{right:auto;left:calc(34px + env(safe-area-inset-left))}
  body.lefty #tbCancel{right:auto;left:calc(198px + env(safe-area-inset-left))}
  body.lefty.touch #instr{left:auto;right:calc(12px + env(safe-area-inset-right))}
  body.on-ground #tbWarp,body.on-ground #tbTgt,body.on-ground #tbGear{opacity:.35}
  #tbMenu{right:calc(14px + env(safe-area-inset-right));top:calc(14px + env(safe-area-inset-top));width:46px;height:46px;border-radius:14px;font-size:20px}
  #tmenu{right:calc(14px + env(safe-area-inset-right));top:calc(66px + env(safe-area-inset-top));padding:8px;display:none;z-index:7;pointer-events:auto;
    grid-template-columns:1fr 1fr;gap:6px;width:min(300px,80vw)}
  body.menu-open #tmenu{display:grid}
  .tm{font:600 13px var(--font);color:var(--ink);background:var(--faint);border:1px solid var(--brd);border-radius:10px;padding:11px 8px;touch-action:none}
  .tm.held{background:var(--glow)}
  #stick{position:fixed;display:none;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;z-index:6;pointer-events:none;
    border:1px solid var(--brd);background:radial-gradient(circle,rgba(127,200,255,.08),rgba(127,200,255,.02) 70%)}
  #knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:var(--glow);border:1px solid var(--accent2);box-shadow:0 0 14px var(--glow)}
  body.touch #done{pointer-events:auto;width:min(760px,94vw);max-height:88vh;overflow:auto;padding:18px 20px}
  body.touch #mission{left:calc(12px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));width:min(300px,calc(100vw - 100px));padding:10px 12px 8px}
  body.touch #instr{left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));width:min(300px,calc(100vw - 100px));padding:10px 12px}
  body.touch #coach{bottom:calc(10px + env(safe-area-inset-bottom));max-width:calc(100vw - 420px);min-width:200px;font-size:12px;padding:6px 12px}
  body.touch #combo{display:none!important}
  body.touch #coach{transition:opacity .6s}
  /* peek: cards fold away to the pill; tap the pill to see them all for 5 s */
  body.touch #mission,body.touch #instr{transition:opacity .35s,visibility .35s}
  body.touch:not(.peek-mission) #mission,body.touch:not(.peek-instr) #instr{opacity:0;visibility:hidden}
  #pill{position:fixed;left:calc(12px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));z-index:6;display:none;
    font:600 12px var(--font);color:var(--ink);background:var(--panel);border:1px solid var(--brd);border-radius:99px;padding:7px 12px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);touch-action:none;max-width:calc(100vw - 90px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.touch:not(.peek-mission) #pill{display:block}
  #ticker{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));z-index:5;pointer-events:none;
    font:700 12px var(--mono);white-space:nowrap;opacity:0;text-shadow:0 1px 6px rgba(0,0,0,.8)}
  #ticker.show{animation:tick 1.6s ease-out forwards}
  @keyframes tick{0%{opacity:0}10%{opacity:1}70%{opacity:1}100%{opacity:0}}
  body.touch #coach .tag{display:inline;margin-right:8px}
  body.touch .combo-row{margin-top:6px}
  body.touch #mission .pips{display:none}
  body.touch .toast{font-size:12px;padding:5px 12px}
  body.touch #toasts{top:calc(40px + env(safe-area-inset-top))}   /* under the ticker */
  body.touch #log{display:none}
  @media (max-width:820px){ body.touch #done .cols{grid-template-columns:1fr} body.touch #done svg{max-height:34vh} }
  @media (max-height:520px){
    body.touch .panel{zoom:calc(var(--font-scale,1) * .82)}
    body.touch #toasts{top:calc(34px + env(safe-area-inset-top))}
  }
  @media (orientation:portrait){
    /* portrait: dock the coach and toasts under the mission card, top of the screen */
    body.touch #coach{bottom:auto;top:var(--stack,200px);left:12px;right:12px;transform:none;max-width:none;min-width:0;font-size:12px;padding:6px 12px}
    body.touch #toasts{top:calc(var(--stack,60px) + 48px)}
    body.touch #mission{width:calc(100vw - 172px)}
  }
</style>
</head>
<body data-theme="nebula">
<canvas id="c"></canvas>
<div id="mission" class="panel"></div>
<div id="instr" class="panel"></div>
<div id="keys" class="panel"></div>
<div id="coach" class="panel"></div>
<div id="toasts"></div>
<div id="combo" class="panel"></div>
<div id="done" class="panel"></div>
<div id="log"></div>
<div id="touch" aria-hidden="true">
  <div id="stick"><div id="knob"></div></div>
  <button id="tbMenu" class="tb" type="button">☰</button>
  <button id="pill" type="button"></button>
  <div id="ticker"></div>
  <div id="tmenu" class="panel">
    <button class="tm" data-key="KeyB" type="button">Flight School</button>
    <button class="tm" data-key="Instr" type="button">Instruments</button>
    <button class="tm" data-key="Coach" type="button">Coach</button>
    <button class="tm" data-key="KeyZ" type="button">Overview</button>
    <button class="tm" data-key="KeyM" type="button">Map</button>
    <button class="tm" data-key="KeyP" type="button">Forecast</button>
    <button class="tm" data-key="KeyV" type="button">Frame target</button>
    <button class="tm" data-key="KeyT" type="button">Theme</button>
    <button class="tm" data-key="KeyN" type="button">Sound</button>
    <button class="tm" data-key="KeyG" type="button">Assist</button>
    <button class="tm" data-key="Full" type="button">Fullscreen</button>
    <button class="tm" data-key="KeyX" type="button">Respawn</button>
    <button class="tm" data-key="KeyL" type="button">Save log</button>
  </div>
  <button id="tbGo" class="tb" data-key="Space" data-hold="1" type="button">◉<span>JUMP</span></button>
  <button id="tbGear" class="tb" data-key="ShiftLeft" data-hold="1" type="button">GEAR</button>
  <button id="tbWarp" class="tb" data-key="KeyF" data-hold="1" type="button">WARP</button>
  <button id="tbTgt" class="tb" data-key="KeyQ" type="button">TARGET</button>
  <button id="tbCancel" class="tb" data-key="Escape" type="button">✕</button>
</div>
<script>
'use strict';
// ============================================================
//  Orbital Courier — 2D prototype
//  Gravity is REAL and summed from every body, every step.
//  Planets ride Keplerian rails, so the field is always shifting.
//  No trajectory prediction: you learn the sky by feel.
// ============================================================

// ---------------- Paul's Arcade glue ----------------
// With the SDK loaded (GitHub Pages / launcher), state lives under arcade.v1.orbital.* via Arcade.state —
// the only storage a sandboxed launcher frame can reach. Without it (node server.js, headless harness)
// we fall back to plain localStorage under the old oc-* keys.
const ARC = typeof window !== 'undefined' && window.Arcade ? window.Arcade : null;
if (ARC) Arcade.init({ gameId: 'orbital' });
const STORE = {
  get(k, dflt) {
    try {
      if (ARC) { const v = ARC.state.get(k); return v === undefined || v === null ? dflt : v; }
      const s = localStorage.getItem('oc-' + k); if (s == null) return dflt;
      try { return JSON.parse(s); } catch (e) { return s; }   // older builds stored bare strings ('off', 'amber')
    } catch (e) { return dflt; }
  },
  set(k, v) {
    try { if (ARC) ARC.state.set(k, v); else localStorage.setItem('oc-' + k, JSON.stringify(v)); } catch (e) {}
  },
};
const PREF = {   // launcher settings, with standalone-safe defaults
  fontScale: () => { try { return ARC ? ARC.settings.fontScale() || 1 : 1; } catch (e) { return 1; } },
  reducedMotion: () => { try { return ARC ? !!ARC.settings.reducedMotion() : false; } catch (e) { return false; } },
  lefty: () => { try { return ARC && ARC.settings.handedness ? ARC.settings.handedness() === 'left' : false; } catch (e) { return false; } },
  volume: () => { try { const v = ARC ? ARC.settings.audioVolume() : 1; return typeof v === 'number' ? v : 1; } catch (e) { return 1; } },
};
let fontMult = PREF.fontScale(), calm = PREF.reducedMotion();   // cached; refreshed on launcher settings change
let touchMode = false, touchAim = null, instrTouch = false, lefty = false;   // touch controls (see 'touch controls')
const isLoopback = () => /^(127\.|localhost$|0\.0\.0\.0$|::1$|\[::1\]$)/.test((typeof location !== 'undefined' && location.hostname) || '');

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const comboEl = $('combo'), missionEl = $('mission'), instrEl = $('instr'), keysEl = $('keys'), coachEl = $('coach'), toastsEl = $('toasts'), logEl = $('log');
let keysFull = false;
function toast(text, cls = '') {
  const d = document.createElement('div'); d.className = 'toast ' + cls; d.textContent = typeof tl === 'function' ? tl(text) : text;
  toastsEl.appendChild(d); setTimeout(() => d.remove(), 2800);
}
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = (W * DPR) | 0; cv.height = (H * DPR) | 0;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
}
addEventListener('resize', resize); resize();

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const rand = (a, b) => a + Math.random() * (b - a);

// ---------------- tuning ----------------
const T = {
  G: 1, soft2: 25,

// ---------------- bodies ----------------
function body(o) {
  return Object.assign({ x: 0, y: 0, vx: 0, vy: 0, r: 10, dens: 16, M: 0, parent: null, R: 0, phase: 0, w: 0,
    color: '#888', name: '', ghost: false, seed: false, gas: false }, o);
}
// ---------------- levels: each has its own star system + physics settings ----------------
let hub, kettle, pip, brindle, bellows, twins, ada, bo, outpost, rocks;     // Level 1 system
let dock, ferry, anvil, wisp, lantern, tern;                                  // Level 2 system
let bodies = [], level = 1;

function buildL1() {
  hub     = body({ name: 'Hearth',  r: 110, dens: T.sunDens, color: '#f2a65a' });
  kettle  = body({ name: 'Kettle',  r: 45, parent: hub, R: 520, phase: 0.3, color: '#6fb3d2' });
  pip     = body({ name: 'Pip',     r: 16, parent: kettle, R: 115, phase: 1.0, color: '#c9c4b8' });
  brindle = body({ name: 'Brindle', r: 52, dens: 12, parent: hub, R: 900, phase: 2.4, color: '#8fcf7a' });
  bellows = body({ name: 'Bellows', r: 72, dens: 14, parent: hub, R: 1180, phase: 0.9, color: '#d9a066', gas: true });  // gas giant: bounce, don't land
  twins   = body({ ghost: true, r: 0, parent: hub, R: 1520, phase: 4.1 });   // binary barycenter
  ada     = body({ name: 'Ada',     r: 28, parent: twins, R: 78, phase: 0, color: '#d98bd0' });
  bo      = body({ name: 'Bo',      r: 28, parent: twins, R: 78, phase: Math.PI, color: '#b28be0' });

    .map(([R, phase, r]) => body({ r, dens: 14, parent: hub, R, phase, color: '#9a8f86' }));
  const wanderer = body({ name: 'Wanderer', comet: true, r: 15, dens: 40, color: '#bfe9ff', ell: { peri: 420, apo: 2300, w0: 2.2, M0: 1.0 } });
  bodies = [hub, wanderer, kettle, pip, brindle, bellows, twins, ada, bo, outpost, ...rocks];   // parents before children
}

// Level 2 "Outer Run": a wide system where your own push is small next to orbital speeds,
// so the outer worlds need a slingshot. Worlds are spread out so each still has room to hop.
function buildL2() {
  hub     = body({ name: 'Cinder',  r: 120, dens: T.sunDens, color: '#ff8f5a' });
  dock    = body({ name: 'Dock',    r: 40, dens: T.worldDens, parent: hub, R: 1100, phase: 0.0, color: '#6fb3d2' });
  ferry   = body({ name: 'Ferry',   r: 36, dens: 9, parent: hub, R: 1550, phase: 2.2, color: '#8fcf7a' });
  anvil   = body({ name: 'Anvil',   r: 90, dens: 10, parent: hub, R: 2050, phase: 1.1, color: '#d9a066', gas: true });
  wisp    = body({ name: 'Wisp',    r: 18, dens: T.worldDens, parent: anvil, R: 270, phase: 0.5, color: '#c9c4b8' });
  lantern = body({ name: 'Lantern', r: 40, dens: T.worldDens, parent: hub, R: 3200, phase: 3.6, color: '#e3d26b' });
  tern    = body({ name: 'Tern',    r: 34, dens: T.worldDens, parent: hub, R: 4000, phase: 5.0, color: '#d98bd0' });
  const skipjack = body({ name: 'Skipjack', comet: true, r: 16, dens: 40, color: '#bfe9ff', ell: { peri: 820, apo: 4300, w0: 4.0, M0: 2.5 } });
  bodies  = [hub, skipjack, dock, ferry, anvil, wisp, lantern, tern];
}

const BASE_T = Object.assign({}, T);
const LEVELS = {
  1: { name: 'Courier', build: buildL1, start: () => kettle, dust: [1760, 2040, 420], streams: [[700, 1.0], [1340, 3.6], [2120, 5.6]],
       T: {},   // the base tuning above
       assistT: {},   // Assist in Level 1 = auto-brake warp + generous slingshot slow-mo
       script: () => [[kettle, pip], [pip, brindle], [brindle, kettle], [kettle, ada], [bo, outpost]],
       intro: 'Walk to the parcel, hop toward Pip — mid-air, Q to ring Pip, hold Shift to anchor' },
  2: { name: 'Outer Run', build: buildL2, start: () => dock, dust: [2480, 2900, 650], streams: [[1320, 2.0], [1680, 4.4], [2700, 0.6], [3600, 3.0]],
       T: { sunDens: 60, worldDens: 7, haloR: 4600, wallR: 4700, lostDist: 14000, coronaR: 300, sunSpit: 120,
            ripSpeed: 380, jumpMin: 80, jumpMax: 145, kick: 25, kickMax: 1, kickRecharge: 6, forecastH: 45, camScale: 0.55, tipWindow: 120, par: 90, expressLimit: 150,
            anchorRange: 550, anchorAccel: 120, anchorDamp: 1.5 },   // anchor = landing gear: catches & settles you near a world, can't carry you between orbits
       assistT: { anchorRange: 650, anchorAccel: 240 },
       script: () => [[dock, ferry], [ferry, wisp], [wisp, lantern], [lantern, dock], [dock, tern]],
       hints: ['Ferry is a short hop — Shift near it to settle in.',
               'Fall toward Anvil and let its pull catch you; Wisp is its moon.',
               "Lantern is too far to jump. Leap off Wisp the way it's moving around Anvil — you'll steal Anvil's speed.",
               'Coming home: pass IN FRONT of a world to shed speed, or just fall — the sun pulls you in.',
               'Tern is the farthest. Chain a slingshot: graze the trailing side of Anvil (behind it as it moves).'],
       intro: 'Your anchor is now <b>landing gear</b> — short range, it settles you onto a world but can\'t carry you.<br>' +
              'Outer worlds are too far to jump. <b>Slingshot</b>: pass close <b>behind</b> a moving world to steal its speed,<br>' +
              'in front of it to lose speed. Gas giants (Anvil) can\'t be landed on — they bounce you.<br>' +
              'Your trail glows <span style="color:#ffb36b">warm</span> while you gain energy, <span style="color:#6bc8ff">cool</span> while you lose it.<br>' +
              '<span style="opacity:.7">Too tough? Press <b>G</b> for Assist (Level 1 anchor).</span>' },
};
let assist = false;

function finishBodies() {
  for (const b of bodies) b.M = b.ghost ? 0 : b.dens * b.r ** 3;
  for (const b of bodies) if (b.ell) { const k = b.ell; k.a = (k.peri + k.apo) / 2; k.e = (k.apo - k.peri) / (k.apo + k.peri); k.n = Math.sqrt(T.G * hub.M / k.a ** 3); }
  for (const b of bodies) {
    if (!b.parent) continue;
    if (b.parent.ghost) b.w = Math.sqrt(T.G * b.M / (4 * b.R ** 3));          // equal-mass binary
    else b.w = Math.sqrt(pull(b.parent, b.R) / b.R);                             // circular orbit for that force law
  }
  // Hill sphere: the region where a world's gravity, not its parent's, decides your orbit
  for (const b of bodies) {
    b.hill = 0;
    if (!b.parent || b.ghost || b.seed) continue;
    if (b.parent === hub || b.parent.ghost) b.hill = (b.parent === hub ? b.R : b.parent.R) * Math.cbrt(b.M / (3 * hub.M));
    else b.hill = b.R * Math.cbrt(b.M / (3 * b.parent.M));
  }
  // sun potential table (for flyby energy accounting)
  PHI.length = 0; let acc = 0;
  for (let r = PHI_MAX; r >= 0; r -= PHI_STEP) { PHI[Math.round(r / PHI_STEP)] = -acc; acc += pull(hub, Math.max(r, 1)) * PHI_STEP; }
}
const PHI = [], PHI_STEP = 5, PHI_MAX = 20000;
const phiSun = r => {   // linear interpolation (a stepped table makes the energy readout jitter)
  const f = Math.min(PHI.length - 1.001, Math.max(0, r / PHI_STEP)), i = Math.floor(f);
  return PHI[i] + (PHI[i + 1] - PHI[i]) * (f - i);
};
// heliocentric orbital energy (sun only) — changes only through planets, kicks, and the anchor
const helioE = () => (P.vx * P.vx + P.vy * P.vy) / 2 + phiSun(Math.hypot(P.x - hub.x, P.y - hub.y));

function applyTuning(n) {
  for (const k in BASE_T) T[k] = BASE_T[k];
  Object.assign(T, LEVELS[n].T);
  if (assist && LEVELS[n].assistT) Object.assign(T, LEVELS[n].assistT);
}

// comets ride Kepler ellipses around the star (solve M = E − e·sinE)
function cometState(b, t, out, cache) {
  const k = b.ell, M = k.M0 + k.n * t;
  let E = cache && cache.E !== undefined ? cache.E + (M - cache.M) / (1 - k.e * Math.cos(cache.E)) : M;   // warm start
  for (let i = 0; i < 8; i++) { const d = (E - k.e * Math.sin(E) - M) / (1 - k.e * Math.cos(E)); E -= d; if (Math.abs(d) < 1e-10) break; }
  if (cache) { cache.E = E; cache.M = M; }
  const cE = Math.cos(E), sE = Math.sin(E), sq = Math.sqrt(1 - k.e * k.e), Ed = k.n / (1 - k.e * cE);
  const xp = k.a * (cE - k.e), yp = k.a * sq * sE, vxp = -k.a * sE * Ed, vyp = k.a * sq * cE * Ed;
  const c = Math.cos(k.w0), s = Math.sin(k.w0);
  out[0] = hub.x + xp * c - yp * s; out[1] = hub.y + xp * s + yp * c; out[2] = vxp * c - vyp * s; out[3] = vxp * s + vyp * c;
  return out;
}
const _cs = [0, 0, 0, 0];
function placeBodies(t) {
  for (const b of bodies) {
    if (b.ell) { cometState(b, t, _cs); b.x = _cs[0]; b.y = _cs[1]; b.vx = _cs[2]; b.vy = _cs[3]; continue; }
    if (!b.parent) continue;
    const p = b.parent, th = b.phase + b.w * t, c = Math.cos(th), s = Math.sin(th);
    b.x = p.x + b.R * c; b.y = p.y + b.R * s;
    b.vx = p.vx - b.R * b.w * s; b.vy = p.vy + b.R * b.w * c;
  }
}

// gravity magnitude from body b at distance d. Inverse-square everywhere, except the sun,
// whose pull flattens to a constant beyond haloR so the system is a bowl you can't escape.
function pull(b, d) {
  if (b === hub && d > T.haloR) return T.G * b.M / (T.haloR * T.haloR) * Math.pow(d / T.haloR, T.haloExp) + (d > T.wallR ? T.wallK * (d - T.wallR) : 0);
  return T.G * b.M / (d * d + T.soft2);
}
const G0 = { ax: 0, ay: 0, dom: null };
function gravAt(x, y, out) {
  let ax = 0, ay = 0, best = hub, bestG = -1;
  for (const b of bodies) {
    if (b.M <= 0) continue;
    const dx = b.x - x, dy = b.y - y, d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
    const g = pull(b, d);
    ax += g * dx / d; ay += g * dy / d;
    if (g > bestG) { bestG = g; best = b; }
  }
  out.ax = ax; out.ay = ay; out.dom = best;
}

// ---------------- player ----------------
const P = {
  x: 0, y: 0, vx: 0, vy: 0, on: null, ang: -Math.PI / 2, walkV: 0,
  charging: false, charge: 0, kicks: T.kickMax, kickT: 0, reach: null, anchor: null, anchorPick: null, anchorLock: false, reachT: 0, lastBody: null, pass: null, skipBody: null, chain: 0, Eprev: 0,
  fullHold: 0, grazes: new Set(), orbBody: null, orbAng: 0, orbSwept: 0, trail: [],
};

// ---------------- game state ----------------
let simT = 0, credits = 0, delivered = 0, seeds = 3, job = null, jobTimer = 0;
const popups = [], particles = [];
function popup(x, y, text, color = '#ffd28a') {
  if (touchMode) { ticker(text, color); return; }   // touch: nothing floats over the middle — the ticker at the top edge carries it
  popups.push({ x, y, text, color, t: 0 });
}
function ticker(text, color) {
  const el = document.getElementById('ticker'); if (!el || !el.classList) return;
  el.textContent = text; el.style.color = color;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');   // restart the one-shot fade
}
// ---- juice: shockwave rings, confetti, shake, hit-stop ----
const RINGS = [];
let hitStop = 0;
function ring(x, y, r0, r1, life, color, w = 3) { RINGS.push({ x, y, r0, r1, life, max: life, color, w }); }
function shake(amount) { if (typeof cam !== 'undefined') cam.shake = Math.min(14, Math.max(cam.shake, amount)); }
const CONFETTI = ['#ffd28a', '#7fc8ff', '#9dffb5', '#ff9cc8', '#ffb36b', '#c4a8ff'];
function confetti(x, y, n = 60, sp = 260) {
  for (let i = 0; i < n; i++) { const a = rand(0, TAU), v = rand(0.25, 1) * sp;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.8, 1.6), max: 1.6, color: CONFETTI[i % CONFETTI.length], big: true }); }
}
function burst(x, y, color, n = 14, sp = 120) {
  for (let i = 0; i < n; i++) { const a = rand(0, TAU), v = rand(0.3, 1) * sp;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.4, 0.9), max: 0.9, color }); }
}

let levelDone = false, lvlCount = 0, paused = false, levelStars = 0;
function newJob() {
  const SCRIPT = LEVELS[level].script();
  if (lvlCount < SCRIPT.length) {
    const [from, to] = SCRIPT[lvlCount];
    job = { from, to, ang: lvlCount === 0 ? -Math.PI / 2 + 0.5 : rand(0, TAU), state: 'wait', value: (level === 2 ? 40 : 20) + lvlCount * 5, t0: 0, style: 0, tNew: simT };
    logEv('job', { from: from.name, to: to.name, value: job.value, scripted: true, level });
    const hint = LEVELS[level].hints && LEVELS[level].hints[lvlCount];
    if (hint) setTimeout(() => popup(P.x, P.y - 40, hint, '#9ad8ff'), 900);
    return;
  }
  const pool = bodies.filter(b => b.name && !b.seed && b !== hub && !b.gas && !b.comet);
  let from, to;
  do { from = pool[(Math.random() * pool.length) | 0]; to = pool[(Math.random() * pool.length) | 0]; } while (from === to);
  const rf = from.parent === hub ? from.R : from.parent ? from.parent.R : 0;
  const rt = to.parent === hub ? to.R : to.parent ? to.parent.R : 0;
  job = { from, to, ang: rand(0, TAU), state: 'wait', value: 15 + Math.round(Math.abs(rf - rt) / 40), t0: 0, style: 0, tNew: simT };
  job.express = (expressCount++ % 2) === 0;   // free play alternates express contracts
  logEv('job', { from: from.name, to: to.name, value: job.value, express: job.express });
  if (job.express) toast(`⚡ EXPRESS: ${from.name} → ${to.name} — ${T.expressLimit}s for ×2.5 pay`, 'gain');
}
let expressCount = 0;

function addStyle(pts, text, color) {
  const w = text.startsWith('PERFECT') ? 3 : text.startsWith('Slingshot') || text.startsWith('full orbit') ? 2 : 1;
  comboHit(text, w);
  const mult = COMBO.n > 1 ? COMBO.mult : 1;
  pts = Math.round(pts * mult); COMBO.pts += pts;
  credits += pts; if (job && job.state === 'carry') job.style += pts;
  popup(P.x, P.y, text + ' +' + pts + (mult > 1 ? ` (×${mult.toFixed(1)})` : ''), color);
  logEv('style', { kind: text, pts });
  if (LOG.flight) { if (text.startsWith('graze')) LOG.flight.grazes++; else if (text.startsWith('full orbit')) LOG.flight.orbits++; }
}

// ---------------- telemetry ----------------
// Records play so we can tune feel from real data. Sent to server.js (logs/) when served from localhost,
// otherwise kept in memory — press L to download.
const LOG = {
  id: new Date().toISOString().replace(/[:.]/g, '-'),
  meta: { started: new Date().toISOString(), screen: [innerWidth, innerHeight], tuning: T, version: 19,
          bodies: [] },
  events: [], samples: [],
  perf: { frames: 0, hitches: 0, worstMs: 0, inputLatMs: [] },
  flight: null, landT: 0, status: 'local',
};
function logEv(type, data) { LOG.events.push(Object.assign({ t: +simT.toFixed(2), type }, data || {})); }
const bname = b => b ? (b.name || (b.seed ? 'seed' : b.ghost ? 'ghost' : 'rock')) : null;
let pendingInputTs = [];
function flushLog(final) {
  const body = JSON.stringify(LOG, (k, v) => k === 'flight' ? undefined : v);
  if (!ARC) try { localStorage.setItem('oc-log-latest', body); } catch (e) {}
  // Only the local dev server (server.js) collects logs; public builds keep them in memory (press L to download).
  if (ARC || !location.protocol.startsWith('http') || !isLoopback()) return;
  const url = '/log?id=' + LOG.id;
  if (final && navigator.sendBeacon) { navigator.sendBeacon(url, body); return; }
  fetch(url, { method: 'POST', body, headers: { 'content-type': 'application/json' } })
    .then(r => LOG.status = r.ok ? 'saved' : 'error ' + r.status).catch(() => LOG.status = 'offline');
}
addEventListener('pagehide', () => { logEv('session_end'); flushLog(true); });
function downloadLog() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(LOG, (k, v) => k === 'flight' ? undefined : v)], { type: 'application/json' }));
  a.download = 'orbital-log-' + LOG.id + '.json'; a.click();
}

// ---------------- player actions ----------------
function land(b) {
  const a = Math.atan2(P.y - b.y, P.x - b.x);
  const rx = P.vx - b.vx, ry = P.vy - b.vy;
  const impact = Math.hypot(rx, ry);
  if (LOG.flight) {
    const f = LOG.flight;
    logEv('land', { to: bname(b), from: f.from, dur: +(simT - f.t0).toFixed(2), impact: impact | 0, charge: f.charge,
      launch: f.launch, maxSun: f.maxSun | 0, kicks: f.kicks, heavy: +f.heavy.toFixed(2), airSteer: f.airSteer,
      extraSpace: f.extraSpace, grazes: f.grazes, orbits: f.orbits, flybys: f.flybys || 0, carrying: !!(job && job.state === 'carry'),
      target: job ? bname(job.state === 'wait' ? job.from : job.to) : null });
    LOG.flight = null;
  }
  LOG.landT = simT;
  P.pass = null; P.chain = 0; P.kickCharging = false;
  if (COMBO.hits) comboEnd('landed');
  if (b.comet) { addStyle(15, 'COMET RIDE ☄ ' + b.name, '#bfe9ff'); toast(`☄ Riding ${b.name} — jump off at its closest pass for a huge boost`, 'gain'); logEv('comet_ride', { comet: b.name }); }
  P.on = b; P.ang = a; P.lastBody = b; P.anchor = null; P.anchorPick = null; P.anchorLock = false; P.kicks = T.kickMax; P.kickT = 0;
  P.walkV = clamp((rx * -Math.sin(a) + ry * Math.cos(a)) * 0.4, -T.walk, T.walk);
  P.grazes.clear(); P.orbBody = null; P.orbSwept = 0;
  if (impact > 120) burst(P.x, P.y, b.color, 10, impact * 0.3);
  sfx.land(impact);
  ring(P.x, P.y, 5, 30 + impact * 0.15, 0.55, b.color, 2.5); shake(clamp(impact / 70, 0, 8));
  if (job && job.state === 'carry' && b === job.to) {
    const tip = Math.max(0, Math.round(T.tipWindow - (simT - job.t0)) * (level === 2 ? 0.5 : 1)) | 0;
    let pay = job.value + tip;
    if (job.express) { pay = Math.round(pay * 2.5); toast(`⚡ EXPRESS delivered ×2.5 — +${pay}`, 'gain'); logEv('express_done', { t: +(simT - job.t0).toFixed(1) }); }
    saveGhost(job, simT - job.t0);
    credits += pay; delivered++; lvlCount++;
    const carryT = simT - job.t0, smart = (job.slings || 0) > 0 || (job.perfect || 0) > 0 || (job.kicks || 0) <= 1;
    const stars = 1 + (carryT <= T.par ? 1 : 0) + (smart ? 1 : 0);
    levelStars += stars;
    toast(`${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}  Delivered to ${b.name} · +${pay}`, 'good'); sfx.deliver(stars); confetti(P.x, P.y, 40 + 20 * stars); ring(P.x, P.y, 8, 120, 0.8, '#9dffb5', 3); shake(4);
    if (stars < 3) setTimeout(() => toast(carryT > T.par ? `★ for under ${T.par}s door-to-door` : `★ for a slingshot or ≤1 kick`, ''), 400);
    logEv('deliver', { stars, kicks: job.kicks || 0, slings: job.slings || 0, to: bname(b), pay, tip, style: job.style, carry: +(simT - job.t0).toFixed(1), total: +(simT - job.tNew).toFixed(1) });
    popup(P.x, P.y, `Delivered! +${pay} (tip ${tip}${job.style ? ', style ' + job.style : ''})`, '#9dffb5');
    burst(P.x, P.y, '#ffd28a', 30, 220);
    if (lvlCount % 2 === 0) { seeds++; setTimeout(() => popup(P.x, P.y, '+1 seed moon', '#7dffb0'), 600); }
    job.state = 'done'; jobTimer = 1.0;
    if (lvlCount === T.levelGoal && !levelDone) {
      confetti(P.x, P.y, 160, 420); shake(6);
      levelDone = true;
      const lt = simT - levelT0; logEv('level_complete', { level, credits, time: +lt.toFixed(1), assist });
      const m = Math.floor(lt / 60), sec = Math.round(lt % 60), next = LEVELS[level + 1];
      showPanel(`<h2 class="ok">Level ${level} complete</h2>
        <div class="lede">${T.levelGoal} parcels in ${m}m ${sec}s · ${credits} credits · <span class="stars">${'★'.repeat(levelStars)}</span> ${levelStars}/${T.levelGoal * 3}</div>

function jump() {

// ---------------- anchor ----------------

// Kick direction: arrows aim it (screen-relative). No arrow = along your motion relative to your anchor

const orbitRadiusOf = b => !b ? 0 : b.parent === hub ? b.R : b.parent ? b.parent.R : 0;

  if (perfect) sfx.perfect(); else sfx.kick(Math.min(1, pow));
  ring(P.x, P.y, 4, 28 + 60 * Math.min(1.5, pow), 0.45, perfect ? '#ffe08a' : TH.accent2, perfect ? 4 : 2.5); shake(1.5 + 3 * Math.min(1, pow));

    tFlight: LOG.flight ? +(simT - LOG.flight.t0).toFixed(2) : null });

function respawn(msg) {
  if (LOG.flight) {
    const f = LOG.flight;
    logEv('flight_end', { reason: msg || 'reset', from: f.from, dur: +(simT - f.t0).toFixed(2), charge: f.charge,
      maxSun: f.maxSun | 0, kicks: f.kicks, heavy: +f.heavy.toFixed(2), airSteer: f.airSteer, extraSpace: f.extraSpace });
    LOG.flight = null;
  }
  if (msg) logEv('respawn', { reason: msg });
  const b = P.lastBody && bodies.includes(P.lastBody) ? P.lastBody : LEVELS[level].start();
  P.pass = null; P.chain = 0;
  P.on = b; P.anchor = null; P.anchorPick = null; P.anchorLock = false; P.ang = rand(0, TAU); P.walkV = 0; P.kicks = T.kickMax; P.kickT = 0; P.trail.length = 0;
  P.grazes.clear(); P.orbBody = null; P.orbSwept = 0;

// ---------------- seeds (build layer) ----------------
let planting = null; // {x,y,t}
// annulus (distance from the sun) that a moving body sweeps over time
function sweptBand(b) {
  if (!b.parent || b.ghost || b.seed) return null;
  if (b.parent === hub) return [b.R - b.r, b.R + b.r];
  const pr = b.parent.R;   // moon / binary member: parent orbits the sun
  return [pr - b.R - b.r, pr + b.R + b.r];
}
function seedProblem(x, y, r) {
  for (const b of bodies) if (!b.ghost && Math.hypot(b.x - x, b.y - y) < b.r + r + 30) return 'too close to ' + (bname(b) === 'rock' ? 'a rock' : bname(b));
  const sd = Math.hypot(x, y);
  if (sd > T.wallR) return 'too far out';
  for (const b of bodies) {
    const band = sweptBand(b); if (!band) continue;
    if (sd + r > band[0] - 8 && sd - r < band[1] + 8) return 'in ' + (b.name ? b.name + "'s" : "the rocks'") + ' path';
  }
  return null;
}
const seedOk = (x, y, r) => !seedProblem(x, y, r);
function plantSeed(x, y, r) {
  const s = body({ seed: true, born: simT, x, y, r: 3, targetR: r, dens: T.seedDens, color: '#7dffb0' });
  s.M = s.dens * s.r ** 3; bodies.push(s); seeds--;
  logEv('seed_plant', { r: +r.toFixed(1), x: x | 0, y: y | 0, sunDist: Math.hypot(x, y) | 0 });
  burst(x, y, '#7dffb0', 16, 90);
}
function removeSeed(s, msg) {
  const i = bodies.indexOf(s); if (i < 0) return;
  bodies.splice(i, 1); seeds++;
  logEv('seed_remove', { reason: msg, age: s.born != null ? +(simT - s.born).toFixed(1) : null });
  if (P.on === s) { P.on = null; P.vx = 0; P.vy = 0; }
  burst(s.x, s.y, '#7dffb0', 20, 150);
  if (msg) popup(s.x, s.y, msg, '#7dffb0');
}
function updateSeeds(dt) {
  for (const s of bodies) {
    if (!s.seed) continue;
    if (s.r < s.targetR) { s.r = Math.min(s.targetR, s.r + (s.targetR / T.seedGrow) * dt); s.M = s.dens * s.r ** 3; }
  }
  for (const s of bodies.slice()) {
    if (!s.seed) continue;
    for (const b of bodies) {
      if (b.seed || b.ghost) continue;
      if (Math.hypot(b.x - s.x, b.y - s.y) < b.r + s.r) { removeSeed(s, (b.name || 'a rock') + ' crushed your seed (refunded)'); break; }
    }
  }
}

// ---------------- simulation step ----------------
function step(dt) {
  simT += dt;
  placeBodies(simT);
  updateSeeds(dt);

  if (P.on) {
    const b = P.on, rr = b.r + T.playerR;
    const dir = (keys.right || keys.d ? 1 : 0) - (keys.left || keys.a ? 1 : 0);
    P.walkV += (dir * T.walk - P.walkV) * Math.min(1, dt * 12);
    P.ang += clamp(P.walkV / rr, -5, 5) * dt;
    const ux = Math.cos(P.ang), uy = Math.sin(P.ang);
    P.x = b.x + rr * ux; P.y = b.y + rr * uy;
    P.vx = b.vx - uy * P.walkV; P.vy = b.vy + ux * P.walkV;
    if (job && job.state === 'wait' && b === job.from && Math.abs(angDiff(P.ang, job.ang)) * rr < 16) {
      job.state = 'carry'; job.t0 = simT; job.style = 0;
      job.rec = []; job.ang0 = Math.atan2(b.y - hub.y, b.x - hub.x); job.recT = -1;   // ghost recording
      if (job.express) toast(`⚡ Clock's running: ${T.expressLimit}s to ${job.to.name}`, 'gain');
      logEv('pickup', { at: b.name, wait: +(simT - job.tNew).toFixed(1) });
      popup(P.x, P.y, 'Got it! → ' + job.to.name, '#ffd28a');
    }
    gravAt(P.x, P.y, G0);
    return;
  }

  // free flight: real summed gravity, semi-implicit Euler (symplectic, no orbital drift)
  gravAt(P.x, P.y, G0);
  let ax = G0.ax, ay = G0.ay;
  // ANCHOR: steady tether toward one chosen world. Ramps in, bleeds off sideways/away drift.
  if (!P.anchorLock) P.anchor = chooseAnchor();
  else if (P.anchor && (!bodies.includes(P.anchor) || Math.hypot(P.anchor.x - P.x, P.anchor.y - P.y) - P.anchor.r > T.anchorRange * 1.5)) {
    popup(P.x, P.y, 'anchor slipped', '#ff9c9c'); logEv('anchor_slip', { from: bname(P.anchor) }); P.anchor = null;
  }
  P.reach = null;
  if (keys.heavy && P.anchor && !inCorona()) {
    const nb = P.anchor; P.reach = nb;
    P.reachT = Math.min(1, P.reachT + dt / T.anchorRamp);
    const dx = nb.x - P.x, dy = nb.y - P.y, d = Math.hypot(dx, dy) || 1, nx = dx / d, ny = dy / d;
    ax += T.anchorAccel * P.reachT * nx; ay += T.anchorAccel * P.reachT * ny;
    const rx = P.vx - nb.vx, ry = P.vy - nb.vy;
    const vt = -rx * ny + ry * nx;            // sideways (tangent t = (-ny, nx))
    const vr = rx * nx + ry * ny;             // >0 approaching, <0 moving away
    const k = Math.min(1, T.anchorDamp * P.reachT * dt);

  P.x += P.vx * dt; P.y += P.vy * dt;
  if (P.kicks < T.kickMax && (P.kickT += dt) >= T.kickRecharge) { P.kicks++; P.kickT = 0; }
  if (LOG.flight) { LOG.flight.maxSun = Math.max(LOG.flight.maxSun, Math.hypot(P.x, P.y)); if (keys.heavy) LOG.flight.heavy += dt; }

  for (const b of bodies) {
    if (b.ghost) continue;
    const dx = P.x - b.x, dy = P.y - b.y, d = Math.hypot(dx, dy);
    const h = d - b.r - T.playerR;
    if (h < 0 && (b === hub || b.gas)) {   // suns and gas giants can't be stood on: elastic bounce in their frame
      const nx = dx / d, ny = dy / d, vn = (P.vx - b.vx) * nx + (P.vy - b.vy) * ny;
      if (vn < 0) { P.vx -= 2 * vn * nx; P.vy -= 2 * vn * ny; }

      P.x = b.x + nx * (b.r + T.playerR); P.y = b.y + ny * (b.r + T.playerR);
      if (b === hub) { P.kicks = T.kickMax; P.kickT = 0; }   // a solar bounce refreshes your kicks
      burst(P.x, P.y, b === hub ? '#ffcf6b' : b.color, 24, 260); sfx.bounce(); comboHit('bounce', 1); ring(P.x, P.y, 8, 130, 0.6, b === hub ? '#ffcf6b' : b.color, 4); shake(8); popup(P.x, P.y, b === hub ? 'solar bounce!' : 'cloud-top bounce!', b === hub ? '#ffcf6b' : '#ffd9a0');
      if (simT - (P.lastBounce || -9) > 0.5) logEv(b === hub ? 'sun_bounce' : 'gas_bounce', { body: bname(b), speed: Math.hypot(P.vx, P.vy) | 0 });
      P.lastBounce = simT;
      continue;
    }
    if (h < 0) { land(b); return; }
    // graze: skim a surface at speed and escape again
    const rel = Math.hypot(P.vx - b.vx, P.vy - b.vy);
    if (h < T.grazeAlt && rel > T.grazeSpeed) P.grazes.add(b);
    else if (h > 90 && P.grazes.has(b)) { P.grazes.delete(b); addStyle(5, 'graze ✦', '#ffe08a'); }
  }

  trackFlyby();
  collectStardust();
  if (COMBO.t > 0 && (COMBO.t -= dt) <= 0) comboEnd('timeout');

  // full orbit around whatever is pulling hardest
  const d = G0.dom, a = Math.atan2(P.y - d.y, P.x - d.x);
  if (d === hub) P.orbBody = null;            // circling the sun is drifting, not style

  }

  if (Math.hypot(P.x, P.y) > T.lostDist) respawn('lost in the void…');
}

// ---------------- slingshots ----------------
// A "pass" starts when you come within a world's pass radius and ends when you leave it.
// We measure how much your orbital energy around the sun changed (planets are the only thing that can change it,
// besides your own kicks), and express it as the equivalent burn at your current speed: "+40" ≈ a free 40 px/s kick.
const passR = b => b.r * 4 + 80;
function trackFlyby() {

  if (!P.pass) {
    for (const b of bodies) {
      if (b.ghost || b === hub || b.seed || b === P.skipBody) continue;
      if (Math.hypot(P.x - b.x, P.y - b.y) - b.r < passR(b)) { P.pass = { b, E0: E, t0: simT, minAlt: Infinity }; break; }
    }
    return;
  }
  const b = P.pass.b;
  if (!bodies.includes(b)) { P.pass = null; return; }
  const alt = Math.hypot(P.x - b.x, P.y - b.y) - b.r;
  P.pass.minAlt = Math.min(P.pass.minAlt, alt);
  if (alt <= passR(b) * 1.15) return;
  const v = Math.hypot(P.vx, P.vy) || 1, dv = (E - P.pass.E0) / v;
  if (Math.abs(dv) >= T.slingMin) {
    if (dv > 0) P.chain++; else P.chain = 0;
    if (dv > 0 && job && job.state === 'carry') job.slings = (job.slings || 0) + 1;
    sfx.sling(dv); if (dv > 0) { shake(3); ring(b.x, b.y, b.r, b.r + 90, 0.7, '#ffb36b', 3); }
    toast(dv > 0 ? `Slingshot! ${bname(b)} +${dv | 0}${P.chain > 1 ? '  ×' + P.chain : ''}` : `Braked by ${bname(b)} ${dv | 0}`, dv > 0 ? 'gain' : 'lose');
    const mult = 1 + 0.5 * Math.max(0, P.chain - 1);
    const pts = Math.round(Math.abs(dv) / 4 * mult);
    if (dv > 0) addStyle(pts, `Slingshot! ${bname(b)} +${dv | 0}${P.chain > 1 ? ' · chain ×' + P.chain : ''}`, '#ffb36b');
    else addStyle(pts, `Braked by ${bname(b)} ${dv | 0}`, '#6bc8ff');
    logEv('flyby', { body: bname(b), dv: dv | 0, minAlt: P.pass.minAlt | 0, dur: +(simT - P.pass.t0).toFixed(1), chain: P.chain, level });
    if (LOG.flight) LOG.flight.flybys = (LOG.flight.flybys || 0) + 1;
  }
  P.pass = null;
}

// ---------------- same-orbit chase (phasing) ----------------
// On a shared orbit you can't "speed up" to catch something: a prograde kick raises your orbit, which is SLOWER.
// To catch a world ahead, slow down (drop lower, lap faster); to let one behind catch you, speed up (rise, lap slower).
function phaseInfo(tgt, osc) {
  if (!tgt || P.on || !osc || !isFinite(osc.Ap) || refBody() !== hub) return null;
  const tb = tgt.parent === hub ? tgt : (tgt.parent && tgt.parent.parent === hub ? tgt.parent : null);   // moons & binaries: chase the parent
  if (!tb) return null;
  const R = tb.R; if (osc.Pe < R * 0.72 || osc.Ap > R * 1.3) return null;   // only when you're on (nearly) its orbit, not just crossing it
  const dir = Math.sign(osc.h) || 1; if (dir !== Math.sign(tb.w)) return null;
  const th = angDiff(Math.atan2(tb.y - hub.y, tb.x - hub.x), Math.atan2(P.y - hub.y, P.x - hub.x)) * dir;   // + = target ahead
  const Tt = TAU / Math.abs(tb.w), Ty = Tt * Math.pow(((osc.Ap + osc.Pe) / 2) / R, 1.5);
  const gain = TAU / Ty - TAU / Tt;   // rad/s you gain on it
  const catchAng = (T.anchorRange + tgt.r) / R, need = Math.max(0, Math.abs(th) - catchAng);
  const eta = need === 0 ? 0 : (Math.sign(gain) === Math.sign(th) && gain !== 0 ? need / Math.abs(gain) : Infinity);
  return { tb, th, deg: Math.abs(th) * 180 / Math.PI, ahead: th > 0, Ty, Tt, eta, lapGainDeg: Math.abs(gain) * Ty * 180 / Math.PI, closing: eta < Infinity };

      ctx.save(); ctx.translate(P.x + dx * r0, P.y + dy * r0); ctx.rotate(a);
      ctx.fillStyle = mode === 'prograde' ? withAlpha(TH.warn, 0.5) : withAlpha(TH.accent2, 0.95);
      ctx.beginPath(); ctx.moveTo(6 * px + 2, 0); ctx.lineTo(-3, -4); ctx.lineTo(-3, 4); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();

  // screen space: labels
  ctx.font = `${12 * fontMult}px ui-monospace,Menlo,monospace`; ctx.textAlign = 'center';
  for (const b of bodies) {
    if (!b.name) continue;
    const [sx, sy] = w2s(b.x, b.y);
    ctx.fillStyle = b === tgt ? '#ffd28a' : withAlpha(b.color, 0.8); ctx.fillText(b.name + (b.gas ? ' ◌' : ''), sx, sy + b.r * cam.zoom + 17);
  }
  // touch screens are small and the action is mid-screen: shorter labels (above), smaller type, lighter plates
  const labK = touchMode ? 0.82 : 1;
  ctx.font = `bold ${12 * fontMult * labK}px ui-monospace,Menlo,monospace`;
  const [psx, psy] = w2s(P.x, P.y), clearR = Math.min(W, H) * 0.32;
  for (const [x, y, text, color] of fcLabels) {
    const [sx, sy] = w2s(x, y);
    if (touchMode && (Math.hypot(sx - W / 2, sy - H / 2) < clearR || Math.hypot(sx - psx, sy - psy) < clearR)) continue;
    ctx.fillStyle = touchMode ? 'rgba(4,5,11,0.35)' : 'rgba(4,5,11,0.6)'; const wdt = ctx.measureText(text).width;
    ctx.fillRect(sx - wdt / 2 - 4, sy - 13 - 12 * labK, wdt + 8, 16 * labK);
    ctx.fillStyle = color; ctx.fillText(text, sx, sy - 13);
  }
  // popups
  ctx.font = `bold ${13 * fontMult * labK}px ui-monospace,Menlo,monospace`;
  for (const p of popups) {
    const [sx, sy] = w2s(p.x, p.y);
    ctx.globalAlpha = clamp(2.2 - p.t, 0, 1); ctx.fillStyle = p.color; ctx.fillText(p.text, sx, sy - 24 - p.t * 30);
  }
  ctx.globalAlpha = 1;
  if (btAmt > 0.03) {   // bullet-time vignette
    const bv = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.7);
    bv.addColorStop(0, 'rgba(0,0,0,0)'); bv.addColorStop(1, `rgba(255,200,110,${0.22 * btAmt})`);
    ctx.fillStyle = bv; ctx.fillRect(0, 0, W, H);
  }
  // speed lines: the world rushing past while you rip
  if (cam.rip > 0.04) {
    const vsp = Math.hypot(P.vx, P.vy) || 1, scrSpeed = vsp * warp * cam.zoom;   // screen px/s
    const cr = Math.cos(-cam.rot), sr = Math.sin(-cam.rot);
    const sdx = (P.vx * cr - P.vy * sr) / vsp, sdy = (P.vx * sr + P.vy * cr) / vsp;   // your motion, on screen
    ctx.save(); ctx.lineCap = 'round';
    for (const sl of SPEEDLINES) {
      sl.x -= sdx * sl.s * scrSpeed * frameDt / W * 0.9; sl.y -= sdy * sl.s * scrSpeed * frameDt / H * 0.9;   // the world rushes past
      if (sl.x < -0.15 || sl.x > 1.15 || sl.y < -0.15 || sl.y > 1.15) {   // respawn ahead of you
        if (Math.abs(sdx) > Math.abs(sdy)) { sl.x = sdx > 0 ? 1.1 : -0.1; sl.y = Math.random(); } else { sl.y = sdy > 0 ? 1.1 : -0.1; sl.x = Math.random(); }
        sl.x += rand(-0.05, 0.05); sl.y += rand(-0.05, 0.05);
      }

      const edge = clamp(Math.hypot(sl.x - 0.5, sl.y - 0.5) * 2.6, 0.1, 1);   // keep the centre (your ship) clear
      ctx.strokeStyle = `rgba(${TH.fc},${(0.08 + 0.28 * sl.s * edge) * cam.rip})`; ctx.lineWidth = sl.w;

    }

    for (let r = gstep; r < sysR * 1.15; r += gstep) { const [sx, sy] = w2s(hub.x + r * 0.7071, hub.y - r * 0.7071); ctx.fillText(r.toLocaleString(), sx, sy); }
  }
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');

  if (TH.scan) { ctx.fillStyle = 'rgba(0,0,0,0.18)'; for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1); }

    if (sx < m || sx > W - m || sy < m || sy > H - m) {
      const dx = sx - W / 2, dy = sy - H / 2, sc = Math.min((W / 2 - m) / Math.abs(dx || 1e-6), (H / 2 - m) / Math.abs(dy || 1e-6));
      const ex = W / 2 + dx * sc, ey = H / 2 + dy * sc, a = Math.atan2(dy, dx);
      ctx.save(); ctx.translate(ex, ey); ctx.rotate(a);
      ctx.fillStyle = '#ffd28a'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-6, -7); ctx.lineTo(-6, 7); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#ffd28a'; ctx.font = `${11 * fontMult}px ui-monospace,Menlo,monospace`;
      ctx.fillText(tb.name, ex - Math.cos(a) * 26, ey - Math.sin(a) * 18 + 4);
    }
  }
}

function drawMinimap(tgt) {
  // touch: smaller, and up top under ☰ so the right thumb's buttons don't cover it
  const R = touchMode ? Math.max(34, Math.min(80, Math.min(W, H) * 0.15, (H - 290) / 2)) : 95, cx = W - R - 16,
    cy = touchMode ? R + 76 : H - R - 16, sR = systemR() * 1.08, k = R / sR;
  const m = (x, y) => [cx + (x - hub.x) * k, cy + (y - hub.y) * k];
  ctx.save();
  ctx.fillStyle = withAlpha(TH.bg, 0.82); ctx.strokeStyle = `rgba(${TH.rail},0.35)`; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, R + 6, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R + 6, 0, TAU); ctx.clip();
  for (const b of bodies) if (b.parent && b.parent === hub) {
    ctx.strokeStyle = b === tgt ? withAlpha(TH.accent, 0.5) : `rgba(${TH.rail},0.14)`;
    ctx.beginPath(); ctx.arc(cx, cy, b.R * k, 0, TAU); ctx.stroke();
  }
  if (FC.main) {
    ctx.strokeStyle = `rgba(${TH.fc},0.7)`; ctx.beginPath();
    FC.main.pts.forEach((p, i) => { const [x, y] = m(p[0], p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
  }
  for (const b of bodies) {
    if (b.ghost) continue;
    const [x, y] = m(b.x, b.y);
    ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(x, y, Math.max(b === hub ? 4 : 1.8, b.r * k), 0, TAU); ctx.fill();
    if (b === tgt) { ctx.strokeStyle = '#ffd28a'; ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.stroke(); }
  }
  ctx.fillStyle = 'rgba(190,233,255,0.9)';
  for (const st of STREAMS) if (st.left) { const [x, y] = m(hub.x + Math.cos(moteAng(st, st.n >> 1, simT)) * st.R, hub.y + Math.sin(moteAng(st, st.n >> 1, simT)) * st.R); ctx.fillRect(x - 1.5, y - 1.5, 3, 3); }
  const [px0, py0] = m(P.x, P.y);
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(px0, py0, 3, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(207,227,255,0.45)'; ctx.font = `${10 * fontMult}px ui-monospace,Menlo,monospace`; ctx.textAlign = 'center';
  ctx.fillText(touchMode ? 'SYSTEM' : 'SYSTEM · M hide · Z overview', cx, cy - R - 12);
}

  if (planting) planting.t += dt;
  recordGhost();
  if (job && job.express && job.state === 'carry' && simT - job.t0 > T.expressLimit) {
    job.express = false; toast(`Express window missed — it's a normal delivery now`); logEv('express_missed');
  }
  if (!paused && job && job.state === 'done') { jobTimer -= dt; if (jobTimer <= 0) { newJob(); popup(P.x, P.y, `New job: ${job.from.name} → ${job.to.name}`, '#ffd28a'); } }
  const E = helioE(), rawGain = P.on || paused || !dt ? 0 : (E - P.Eprev) / dt / Math.max(50, Math.hypot(P.vx, P.vy));
  P.Eprev = E; P.gainS = (P.gainS || 0) + (rawGain - (P.gainS || 0)) * Math.min(1, dt * 8);   // smoothed
  const gain = P.gainS;
  if (!paused) { P.trail.push([P.x, P.y, gain]); if (P.trail.length > 320) P.trail.shift(); }
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  for (let i = particles.length - 1; i >= 0; i--) if (particles[i].life <= 0) particles.splice(i, 1);
  for (const p of popups) p.t += dt;
  for (let i = popups.length - 1; i >= 0; i--) if (popups[i].t > 2.2) popups.splice(i, 1);
  for (const b of bodies) if (b.ell && !paused) {   // announce a comet's swing past the star
    const r = Math.hypot(b.x - hub.x, b.y - hub.y);
    if (r < b.ell.peri * 1.35 && !b.announced) { b.announced = true; toast(`☄ ${b.name} is swinging past ${hub.name} — big slingshots for a moment`, 'gain'); }
    if (r > b.ell.peri * 2) b.announced = false;
  }
  cam.shake *= Math.exp(-dt * 9); if (cam.shake < 0.05) cam.shake = 0;
  updateAudio();
  updateCamera(dt);
  updateForecast();
  draw();
  if ((hudT -= dt) <= 0) { updateHud(); hudT = 0.1; }
}

// Arcade.loop owns rAF under the launcher: it cancels while the game is hidden/suspended and resumes cleanly.
if (ARC && ARC.loop) ARC.loop(() => frame(performance.now())).start();
else { const raf = now => { frame(now); requestAnimationFrame(raf); }; requestAnimationFrame(raf); }

// ---------------- Paul's Arcade lifecycle ----------------
function hydrate() {   // (re)read saved state: on SDK ready (framed storage arrives async) and after a save import
  GHOSTS = STORE.get('ghosts', {}) || {};
  SND.on = STORE.get('sound', 'on') !== 'off'; applyVolume();
  const t = STORE.get('theme', null);
  if (t && THEMES[t] && !new URLSearchParams(location.search || '').get('theme')) setTheme(t);
}
if (ARC) {
  ARC.ready.then(() => { hydrate(); applyHandedness(); });
  ARC.onStateReplaced(hydrate);
  ARC.onSettingsChange(() => { fontMult = PREF.fontScale(); calm = PREF.reducedMotion(); applyVolume(); applyHandedness(); });
  ARC.onSuspend(() => {
    for (const k in keys) keys[k] = false;   // a key held while switching away must not stay stuck
    if (touchMode) touchReset();
    if (SND.ctx && SND.ctx.state === 'running') SND.ctx.suspend();
  });
  ARC.onResume(() => { last = performance.now(); acc = 0; if (SND.ctx && SND.ctx.state === 'suspended') SND.ctx.resume(); });
}
</script>
<!-- Offline play for the installed PWA. Loopback-guarded so local edits are never masked by a stale cache;
     fire-and-forget so a failure (or the SDK's inert stub inside launcher frames) never breaks boot. -->
<script>
  if ('serviceWorker' in navigator && !/^(127\.|localhost$|0\.0\.0\.0$|::1$)/.test(location.hostname)) {
    window.addEventListener('load', () => {
      try { navigator.serviceWorker.register('sw.js', { scope: '/orbital/' }).catch((err) => console.warn('SW registration failed:', err)); }
      catch (err) { console.warn('SW registration failed:', err); }
    });
  }
</script>
