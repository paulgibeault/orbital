<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Orbital Courier — prototype</title>
<style>
  :root{
    --bg:#04050b; --panel:rgba(12,16,34,.64); --brd:rgba(150,175,255,.16); --ink:#e3ebff; --dim:#8c9cc6; --faint:rgba(220,230,255,.08);
    --accent:#ffd28a; --accent2:#7fc8ff; --good:#9dffb5; --warn:#ffb36b; --bad:#ff9c9c; --glow:rgba(127,200,255,.25);
    --font:"Avenir Next","SF Pro Display",-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  body[data-theme=blueprint]{ --bg:#071a36; --panel:rgba(6,28,62,.72); --brd:rgba(140,205,255,.38); --ink:#eef7ff; --dim:#94bde6;
    --accent:#ffffff; --accent2:#7fe6ff; --glow:rgba(127,230,255,.25); --faint:rgba(140,205,255,.1); }
  body[data-theme=amber]{ --bg:#0c0703; --panel:rgba(32,19,6,.74); --brd:rgba(255,176,70,.3); --ink:#ffe2b0; --dim:#c3925a;
    --accent:#ffb347; --accent2:#ffd27a; --good:#d6ff9a; --warn:#ff9a4a; --glow:rgba(255,176,70,.22); --faint:rgba(255,176,70,.08);
    --font:"SF Mono",ui-monospace,Menlo,monospace; }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
  canvas{display:block;cursor:crosshair}
  b{color:var(--accent);font-weight:600}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--brd);border-radius:16px;pointer-events:none;
    backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%);
    box-shadow:0 10px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px rgba(0,0,0,.25)}
  .panel::before{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
    background:linear-gradient(135deg,var(--glow),transparent 35%);opacity:.5}
  .hdr{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
  .hdr i{font-style:normal;color:var(--accent2)}
  #mission{left:18px;top:18px;width:340px;padding:14px 16px 12px}
  #instr{left:18px;bottom:18px;width:340px;padding:12px 16px 12px}
  #keys{right:18px;top:18px;width:270px;padding:12px 14px;font-size:12px;line-height:1.75}
  #coach{left:50%;bottom:20px;transform:translateX(-50%);padding:10px 20px;font-size:14px;max-width:min(620px,48vw);text-align:center;line-height:1.45;transition:opacity .3s}
  .warpnum{font-size:24px;font-weight:800;color:var(--accent2);font-family:var(--mono);margin:0 10px 0 4px;vertical-align:-3px;text-shadow:0 0 14px var(--glow)}
  #coach .tag{font-size:10px;letter-spacing:.2em;color:var(--accent2);display:block;margin-bottom:2px}
  #toasts{position:fixed;left:50%;top:18px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:5}
  .toast{padding:7px 16px;border-radius:99px;font-weight:600;font-size:14px;background:var(--panel);border:1px solid var(--brd);
    backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.4);animation:toast 2.8s ease forwards}
  .toast.gain{color:var(--warn);border-color:rgba(255,179,107,.5)} .toast.lose{color:var(--accent2);border-color:rgba(127,200,255,.5)}
  .toast.good{color:var(--good);border-color:rgba(157,255,181,.5)} .toast.bad{color:var(--bad)}
  @keyframes toast{0%{opacity:0;transform:translateY(-8px) scale(.96)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
  .title{font-size:19px;font-weight:700;letter-spacing:.02em;margin:0 0 2px}
  .sub{font-size:12px;color:var(--dim)}
  .route{display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0 8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--faint);border:1px solid var(--brd);font-weight:600}
  .chip.now{border-color:var(--accent);box-shadow:0 0 12px var(--glow)}
  .chip .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 6px currentColor}
  .arrow{color:var(--dim)}
  .pips{display:flex;gap:5px;margin:8px 0 4px}
  .pips span{flex:1;height:6px;border-radius:3px;background:var(--faint)} .pips span.on{background:linear-gradient(90deg,var(--accent2),var(--accent))}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);margin:4px 0}
  .row b,.num{color:var(--ink);font-family:var(--mono);font-weight:500}
  .bar{height:5px;border-radius:3px;background:var(--faint);overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:3px}
  .stars{color:var(--accent);letter-spacing:1px;font-size:13px}
  .gauge{position:relative;height:30px;margin:8px 0 4px}
  .gauge .track{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:var(--faint)}
  .gauge .band{position:absolute;top:10px;height:10px;border-radius:5px;background:linear-gradient(90deg,rgba(127,200,255,.55),rgba(127,200,255,.9));box-shadow:0 0 10px var(--glow)}
  .gauge .tgt{position:absolute;top:6px;height:18px;border-radius:4px;background:rgba(255,210,138,.25);border:1px solid var(--accent)}
  .gauge .tick{position:absolute;top:-2px;font-size:9.5px;color:var(--dim);transform:translateX(-50%);font-family:var(--mono);white-space:nowrap}
  .gauge{margin:12px 8px 8px}
  .gauge .tick.lo{top:23px}
  .gauge + .row{margin-top:14px}
  .ok{color:var(--good)!important} .warn{color:var(--warn)!important} .bad{color:var(--bad)!important}
  kbd{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--faint);border:1px solid var(--brd);border-bottom-width:2px;color:var(--ink);white-space:nowrap}
  #keys .k{display:flex;justify-content:space-between;gap:10px} #keys .k span:last-child{color:var(--dim);text-align:right}
  #keys .sep{height:1px;background:var(--brd);margin:6px 0}
  #done{left:50%;top:46%;transform:translate(-50%,-50%);width:min(760px,86vw);padding:26px 30px;font-size:14px;line-height:1.6;display:none;z-index:10}
  #done h2{margin:0 0 4px;font-size:24px;letter-spacing:.03em} #done .lede{color:var(--dim);margin-bottom:12px}
  #done .cols{display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:center}
  #done svg{width:100%;height:auto;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--brd)}
  #done .foot{margin-top:14px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
  #done .dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin:0 3px} #done .dots span.on{background:var(--accent)}
  #done ul{margin:6px 0;padding-left:18px} #done li{margin:3px 0}
  #log{position:fixed;right:22px;bottom:6px;font-size:10px;color:var(--dim);opacity:.6;font-family:var(--mono);pointer-events:none}
  .hide{display:none!important}
  #done svg .o{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:3 4;opacity:.75}
  #done svg .o2{fill:none;stroke:var(--accent);stroke-width:1.4;opacity:.8}
  #done svg .p{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
  #done svg .pk{fill:none;stroke:var(--accent2);stroke-width:2;stroke-dasharray:6 5}
  #done svg .gd{fill:none;stroke:var(--good);stroke-width:1.6;stroke-dasharray:4 4}
  #done svg .bd{fill:none;stroke:var(--bad);stroke-width:1.6;opacity:.7}
  #done svg .sun{fill:#ffb066;filter:drop-shadow(0 0 6px #ff9a40)} #done svg .pl{fill:var(--accent2)} #done svg .tg{fill:var(--accent)}
  #done svg .gas{fill:#d9a066} #done svg .me{fill:#fff} #done svg .ah{fill:var(--warn)} #done svg .ah2{fill:var(--accent2)}
  #done svg .w{stroke:var(--warn);stroke-width:2.4;fill:none} #done svg .g2{stroke:var(--accent2);stroke-width:2;fill:none}
  #done svg text{fill:var(--ink);font:10.5px var(--mono)} #done svg .dim{fill:var(--dim)} #done svg .acc{fill:var(--accent)} #done svg .ok{fill:var(--good)}
  #done svg .warnt{fill:var(--warn)}
</style>
</head>
<body data-theme="nebula">
<canvas id="c"></canvas>
<div id="mission" class="panel"></div>
<div id="instr" class="panel"></div>
<div id="keys" class="panel"></div>
<div id="coach" class="panel"></div>
<div id="toasts"></div>
<div id="done" class="panel"></div>
<div id="log"></div>
<script>
'use strict';
// ============================================================
//  Orbital Courier — 2D prototype
//  Gravity is REAL and summed from every body, every step.
//  Planets ride Keplerian rails, so the field is always shifting.
//  No trajectory prediction: you learn the sky by feel.
// ============================================================

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const missionEl = $('mission'), instrEl = $('instr'), keysEl = $('keys'), coachEl = $('coach'), toastsEl = $('toasts'), logEl = $('log');
let keysFull = false;
function toast(text, cls = '') {
  const d = document.createElement('div'); d.className = 'toast ' + cls; d.textContent = text;
  toastsEl.appendChild(d); setTimeout(() => d.remove(), 2800);
}
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = (W * DPR) | 0; cv.height = (H * DPR) | 0;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
}
addEventListener('resize', resize); resize();

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const rand = (a, b) => a + Math.random() * (b - a);

// ---------------- tuning ----------------
const T = {
  G: 1, soft2: 25,
  walk: 170, jumpMin: 90, jumpMax: 340, chargeTime: 0.7,
  kick: 90, kickMax: 2, kickRecharge: 5, kickMinPow: 0.2, kickChargeTime: 0.8,   // hold Space in flight: 20%→100% power
  // ANCHOR (Shift): a tether to one world within range. Ring shows which; Q/Tab switches; locked while held.
  anchorRange: 650, anchorAccel: 240, anchorDamp: 0.8, anchorRamp: 0.35, anchorTargetBias: 0.5, anchorKeep: 1.25,
  coronaR: 260, sunSpit: 90,          // too close to the sun: anchor disabled so the solar bounce always carries you out
  wallR: 2600, wallK: 0.06,   // gentle outer wall beyond every world: far drifts turn back sooner
  sunDens: 18, worldDens: 16, levelGoal: 5,
  playerR: 7, lostDist: 9000,
  haloR: 1100, haloExp: 0.5,   // beyond this the sun's pull stops weakening (a 'halo' bowl): nothing escapes forever, big jumps become long swoops
  seedDens: 12, seedMinR: 10, seedMaxR: 36, seedGrow: 2.5, seedHold: 1.2,
  grazeAlt: 28, grazeSpeed: 180, slingMin: 15,
  warpMax: 8, warpLead: 2.5, ripZoom: 1.25,
  btScale: 0.3, btMax: 3, perfectBoost: 1.5,   // slingshot bullet-time: time ×0.3 at the bottom of a fast pass (≤3 s); perfect kicks ×1.5   // F: warp up to ×8, braking so events arrive ≥2.5 s real-time away
  forecastH: 10, camScale: 1,   // forecast horizon (s); camera zoom scale for the level
  tipWindow: 30, par: 25,       // seconds: tip runs out / ★ for a delivery at or under par
  step: 1 / 240,
};

// ---------------- bodies ----------------
function body(o) {
  return Object.assign({ x: 0, y: 0, vx: 0, vy: 0, r: 10, dens: 16, M: 0, parent: null, R: 0, phase: 0, w: 0,
    color: '#888', name: '', ghost: false, seed: false, gas: false }, o);
}
// ---------------- levels: each has its own star system + physics settings ----------------
let hub, kettle, pip, brindle, bellows, twins, ada, bo, outpost, rocks;     // Level 1 system
let dock, ferry, anvil, wisp, lantern, tern;                                  // Level 2 system
let bodies = [], level = 1;

function buildL1() {
  hub     = body({ name: 'Hearth',  r: 110, dens: T.sunDens, color: '#f2a65a' });
  kettle  = body({ name: 'Kettle',  r: 45, parent: hub, R: 520, phase: 0.3, color: '#6fb3d2' });
  pip     = body({ name: 'Pip',     r: 16, parent: kettle, R: 115, phase: 1.0, color: '#c9c4b8' });
  brindle = body({ name: 'Brindle', r: 52, dens: 12, parent: hub, R: 900, phase: 2.4, color: '#8fcf7a' });
  bellows = body({ name: 'Bellows', r: 72, dens: 14, parent: hub, R: 1180, phase: 0.9, color: '#d9a066', gas: true });  // gas giant: bounce, don't land
  twins   = body({ ghost: true, r: 0, parent: hub, R: 1520, phase: 4.1 });   // binary barycenter
  ada     = body({ name: 'Ada',     r: 28, parent: twins, R: 78, phase: 0, color: '#d98bd0' });
  bo      = body({ name: 'Bo',      r: 28, parent: twins, R: 78, phase: Math.PI, color: '#b28be0' });
  outpost = body({ name: 'Outpost', r: 40, parent: hub, R: 2250, phase: 5.4, color: '#e3d26b' });
  rocks = [[1820, 0.4, 11], [1850, 1.6, 9], [1880, 2.9, 13], [1915, 3.8, 10], [1950, 5.0, 12]]
    .map(([R, phase, r]) => body({ r, dens: 14, parent: hub, R, phase, color: '#9a8f86' }));
  bodies = [hub, kettle, pip, brindle, bellows, twins, ada, bo, outpost, ...rocks];   // parents before children
}

// Level 2 "Outer Run": a wide system where your own push is small next to orbital speeds,
// so the outer worlds need a slingshot. Worlds are spread out so each still has room to hop.
function buildL2() {
  hub     = body({ name: 'Cinder',  r: 120, dens: T.sunDens, color: '#ff8f5a' });
  dock    = body({ name: 'Dock',    r: 40, dens: T.worldDens, parent: hub, R: 1100, phase: 0.0, color: '#6fb3d2' });
  ferry   = body({ name: 'Ferry',   r: 36, dens: 9, parent: hub, R: 1550, phase: 2.2, color: '#8fcf7a' });
  anvil   = body({ name: 'Anvil',   r: 90, dens: 10, parent: hub, R: 2050, phase: 1.1, color: '#d9a066', gas: true });
  wisp    = body({ name: 'Wisp',    r: 18, dens: T.worldDens, parent: anvil, R: 270, phase: 0.5, color: '#c9c4b8' });
  lantern = body({ name: 'Lantern', r: 40, dens: T.worldDens, parent: hub, R: 3200, phase: 3.6, color: '#e3d26b' });
  tern    = body({ name: 'Tern',    r: 34, dens: T.worldDens, parent: hub, R: 4000, phase: 5.0, color: '#d98bd0' });
  bodies  = [hub, dock, ferry, anvil, wisp, lantern, tern];
}

const BASE_T = Object.assign({}, T);
const LEVELS = {
  1: { name: 'Courier', build: buildL1, start: () => kettle, dust: [1760, 2040, 420],
       T: {},   // the base tuning above
       script: () => [[kettle, pip], [pip, brindle], [brindle, kettle], [kettle, ada], [bo, outpost]],
       intro: 'Walk to the parcel, hop toward Pip — mid-air, Q to ring Pip, hold Shift to anchor' },
  2: { name: 'Outer Run', build: buildL2, start: () => dock, dust: [2480, 2900, 650],
       T: { sunDens: 60, worldDens: 7, haloR: 4600, wallR: 4700, lostDist: 14000, coronaR: 300, sunSpit: 120,
            jumpMin: 80, jumpMax: 145, kick: 25, kickMax: 1, kickRecharge: 6, forecastH: 45, camScale: 0.55, tipWindow: 120, par: 90,
            anchorRange: 550, anchorAccel: 120, anchorDamp: 1.5 },   // anchor = landing gear: catches & settles you near a world, can't carry you between orbits
       assistT: { anchorRange: 650, anchorAccel: 240 },
       script: () => [[dock, ferry], [ferry, wisp], [wisp, lantern], [lantern, dock], [dock, tern]],
       hints: ['Ferry is a short hop — Shift near it to settle in.',
               'Fall toward Anvil and let its pull catch you; Wisp is its moon.',
               "Lantern is too far to jump. Leap off Wisp the way it's moving around Anvil — you'll steal Anvil's speed.",
               'Coming home: pass IN FRONT of a world to shed speed, or just fall — the sun pulls you in.',
               'Tern is the farthest. Chain a slingshot: graze the trailing side of Anvil (behind it as it moves).'],
       intro: 'Your anchor is now <b>landing gear</b> — short range, it settles you onto a world but can\'t carry you.<br>' +
              'Outer worlds are too far to jump. <b>Slingshot</b>: pass close <b>behind</b> a moving world to steal its speed,<br>' +
              'in front of it to lose speed. Gas giants (Anvil) can\'t be landed on — they bounce you.<br>' +
              'Your trail glows <span style="color:#ffb36b">warm</span> while you gain energy, <span style="color:#6bc8ff">cool</span> while you lose it.<br>' +
              '<span style="opacity:.7">Too tough? Press <b>G</b> for Assist (Level 1 anchor).</span>' },
};
let assist = false;

function finishBodies() {
  for (const b of bodies) b.M = b.ghost ? 0 : b.dens * b.r ** 3;
  for (const b of bodies) {
    if (!b.parent) continue;
    if (b.parent.ghost) b.w = Math.sqrt(T.G * b.M / (4 * b.R ** 3));          // equal-mass binary
    else b.w = Math.sqrt(pull(b.parent, b.R) / b.R);                             // circular orbit for that force law
  }
  // Hill sphere: the region where a world's gravity, not its parent's, decides your orbit
  for (const b of bodies) {
    b.hill = 0;
    if (!b.parent || b.ghost || b.seed) continue;
    if (b.parent === hub || b.parent.ghost) b.hill = (b.parent === hub ? b.R : b.parent.R) * Math.cbrt(b.M / (3 * hub.M));
    else b.hill = b.R * Math.cbrt(b.M / (3 * b.parent.M));
  }
  // sun potential table (for flyby energy accounting)
  PHI.length = 0; let acc = 0;
  for (let r = PHI_MAX; r >= 0; r -= PHI_STEP) { PHI[Math.round(r / PHI_STEP)] = -acc; acc += pull(hub, Math.max(r, 1)) * PHI_STEP; }
}
const PHI = [], PHI_STEP = 5, PHI_MAX = 20000;
const phiSun = r => {   // linear interpolation (a stepped table makes the energy readout jitter)
  const f = Math.min(PHI.length - 1.001, Math.max(0, r / PHI_STEP)), i = Math.floor(f);
  return PHI[i] + (PHI[i + 1] - PHI[i]) * (f - i);
};
// heliocentric orbital energy (sun only) — changes only through planets, kicks, and the anchor
const helioE = () => (P.vx * P.vx + P.vy * P.vy) / 2 + phiSun(Math.hypot(P.x - hub.x, P.y - hub.y));

function applyTuning(n) {
  for (const k in BASE_T) T[k] = BASE_T[k];
  Object.assign(T, LEVELS[n].T);
  if (assist && LEVELS[n].assistT) Object.assign(T, LEVELS[n].assistT);
}

function placeBodies(t) {
  for (const b of bodies) {
    if (!b.parent) continue;
    const p = b.parent, th = b.phase + b.w * t, c = Math.cos(th), s = Math.sin(th);
    b.x = p.x + b.R * c; b.y = p.y + b.R * s;
    b.vx = p.vx - b.R * b.w * s; b.vy = p.vy + b.R * b.w * c;
  }
}

// gravity magnitude from body b at distance d. Inverse-square everywhere, except the sun,
// whose pull flattens to a constant beyond haloR so the system is a bowl you can't escape.
function pull(b, d) {
  if (b === hub && d > T.haloR) return T.G * b.M / (T.haloR * T.haloR) * Math.pow(d / T.haloR, T.haloExp) + (d > T.wallR ? T.wallK * (d - T.wallR) : 0);
  return T.G * b.M / (d * d + T.soft2);
}
const G0 = { ax: 0, ay: 0, dom: null };
function gravAt(x, y, out) {
  let ax = 0, ay = 0, best = hub, bestG = -1;
  for (const b of bodies) {
    if (b.M <= 0) continue;
    const dx = b.x - x, dy = b.y - y, d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
    const g = pull(b, d);
    ax += g * dx / d; ay += g * dy / d;
    if (g > bestG) { bestG = g; best = b; }
  }
  out.ax = ax; out.ay = ay; out.dom = best;
}

// ---------------- player ----------------
const P = {
  x: 0, y: 0, vx: 0, vy: 0, on: null, ang: -Math.PI / 2, walkV: 0,
  charging: false, charge: 0, kicks: T.kickMax, kickT: 0, reach: null, anchor: null, anchorPick: null, anchorLock: false, reachT: 0, lastBody: null, pass: null, skipBody: null, chain: 0, Eprev: 0,
  fullHold: 0, grazes: new Set(), orbBody: null, orbAng: 0, orbSwept: 0, trail: [],
};

// ---------------- game state ----------------
let simT = 0, credits = 0, delivered = 0, seeds = 3, job = null, jobTimer = 0;
const popups = [], particles = [];
function popup(x, y, text, color = '#ffd28a') { popups.push({ x, y, text, color, t: 0 }); }
function burst(x, y, color, n = 14, sp = 120) {
  for (let i = 0; i < n; i++) { const a = rand(0, TAU), v = rand(0.3, 1) * sp;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.4, 0.9), max: 0.9, color }); }
}

let levelDone = false, lvlCount = 0, paused = false, levelStars = 0;
function newJob() {
  const SCRIPT = LEVELS[level].script();
  if (lvlCount < SCRIPT.length) {
    const [from, to] = SCRIPT[lvlCount];
    job = { from, to, ang: lvlCount === 0 ? -Math.PI / 2 + 0.5 : rand(0, TAU), state: 'wait', value: (level === 2 ? 40 : 20) + lvlCount * 5, t0: 0, style: 0, tNew: simT };
    logEv('job', { from: from.name, to: to.name, value: job.value, scripted: true, level });
    const hint = LEVELS[level].hints && LEVELS[level].hints[lvlCount];

  }
  const pool = bodies.filter(b => b.name && !b.seed && b !== hub && !b.gas);
  let from, to;
  do { from = pool[(Math.random() * pool.length) | 0]; to = pool[(Math.random() * pool.length) | 0]; } while (from === to);
  const rf = from.parent === hub ? from.R : from.parent ? from.parent.R : 0;
  const rt = to.parent === hub ? to.R : to.parent ? to.parent.R : 0;
  job = { from, to, ang: rand(0, TAU), state: 'wait', value: 15 + Math.round(Math.abs(rf - rt) / 40), t0: 0, style: 0, tNew: simT };
  logEv('job', { from: from.name, to: to.name, value: job.value });
}

// ---------------- player actions ----------------

    popup(P.x, P.y, `Delivered! +${pay} (tip ${tip}${job.style ? ', style ' + job.style : ''})`, '#9dffb5');

function jump() {
  const b = P.on, a = P.ang, s = lerp(T.jumpMin, T.jumpMax, P.charge);
  const ux = Math.cos(a), uy = Math.sin(a);

    dwell: +(simT - LOG.landT).toFixed(2), fullHold: +P.fullHold.toFixed(2) });

    airSteer: 0, extraSpace: 0, grazes: 0, orbits: 0 };

// ---------------- anchor ----------------
const currentTarget = () => job && job.state !== 'done' ? (job.state === 'wait' ? job.from : job.to) : null;
function anchorCandidates() {
  const list = [];

    if (b.ghost || b === hub || b.gas) continue;
    const sd = Math.hypot(b.x - P.x, b.y - P.y) - b.r;

}

function chooseAnchor() {
  const c = anchorCandidates();
  if (P.anchorPick) { if (c.some(x => x[0] === P.anchorPick)) return P.anchorPick; P.anchorPick = null; }
  const want = currentTarget(), score = (b, sd) => b === want ? sd * T.anchorTargetBias : sd;
  let best = null, bs = Infinity, cur = Infinity;
  for (const [b, sd] of c) { const sc = score(b, sd); if (sc < bs) { bs = sc; best = b; } if (b === P.anchor) cur = sc; }
  return cur < bs * T.anchorKeep ? P.anchor : best;   // a little stickiness so the ring doesn't flicker
}
function cycleAnchor() {
  if (P.on) return;
  const c = anchorCandidates();
  if (!c.length) { popup(P.x, P.y, 'no world in reach', '#ff9c9c'); logEv('anchor_cycle', { to: null }); return; }
  const i = c.findIndex(x => x[0] === P.anchor), nb = c[(i + 1) % c.length][0];
  P.anchorPick = nb; P.anchor = nb; if (P.anchorLock) P.reachT = 0;

}
function anchorPress() {
  if (P.on) return;
  P.anchorLock = true; P.reachT = 0;
  if (!P.anchor) P.anchor = chooseAnchor();
  logEv('anchor', { to: bname(P.anchor), corona: inCorona(), picked: !!P.anchorPick });
  if (!P.anchor) popup(P.x, P.y, 'nothing in reach', '#ff9c9c');
  else if (inCorona()) popup(P.x, P.y, 'too close to the sun', '#ffcf6b');
}

// Kick direction: arrows aim it (screen-relative). No arrow = along your motion relative to your anchor
// (or whatever pulls hardest) — so kicking at your fastest pass still adds the most energy (Oberth).
// The body you're orbiting: the smallest Hill sphere you're inside (else the star).
function refBody(x = P.x, y = P.y) {
  let best = hub, bh = Infinity;
  for (const b of bodies) if (b.hill && b.hill < bh && Math.hypot(x - b.x, y - b.y) < b.hill) { bh = b.hill; best = b; }
  return best;
}
// Orbital directions relative to the body you orbit: prograde (along motion), retrograde, radial out / in.
function orbitAxes(ref = refBody()) {
  const rx = P.vx - ref.vx, ry = P.vy - ref.vy, L = Math.hypot(rx, ry) || 1;
  const ox = P.x - ref.x, oy = P.y - ref.y, O = Math.hypot(ox, oy) || 1;
  return { ref, pro: [rx / L, ry / L], out: [ox / O, oy / O], speed: L };
}
// Kick direction. W/S = prograde/retrograde, A/D = radial in/out (the real orbital controls).
// Arrows still aim on screen. No key = prograde.
function kickDir() {
  const ax = orbitAxes();
  let dx = 0, dy = 0;
  if (keys.w) { dx += ax.pro[0]; dy += ax.pro[1]; }
  if (keys.s) { dx -= ax.pro[0]; dy -= ax.pro[1]; }
  if (keys.d) { dx += ax.out[0]; dy += ax.out[1]; }
  if (keys.a) { dx -= ax.out[0]; dy -= ax.out[1]; }
  if (dx || dy) { const n = Math.hypot(dx, dy); return [dx / n, dy / n, 'orbit']; }
  const sx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), sy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  if (sx || sy) {
    const L = Math.hypot(sx, sy), c = Math.cos(cam.rot), s = Math.sin(cam.rot);
    return [(sx * c - sy * s) / L, (sx * s + sy * c) / L, 'aim'];
  }

}
// Osculating orbit around the star from a state: turning points of the effective potential (works with the halo too),
// plus the Kepler ellipse when the whole orbit is inside the inverse-square region.
function oscOrbit(x = P.x, y = P.y, vx = P.vx, vy = P.vy) {
  const rx = x - hub.x, ry = y - hub.y, r = Math.hypot(rx, ry) || 1, v2 = vx * vx + vy * vy;
  const E = v2 / 2 + phiSun(r), h = rx * vy - ry * vx, U = q => h * h / (2 * q * q) + phiSun(q);
  let Ap = r, Pe = r;
  while (Ap < 16000 && U(Ap + 10) <= E) Ap += 10;
  while (Pe > 10 && U(Pe - 10) <= E) Pe -= 10;
  const out = { Ap: Ap >= 16000 ? Infinity : Ap, Pe, E, h, ellipse: null };
  if (out.Ap < T.haloR) {
    const mu = T.G * hub.M, rv = rx * vx + ry * vy;

}
const orbitRadiusOf = b => !b ? 0 : b.parent === hub ? b.R : b.parent ? b.parent.R : 0;
function kick(pow = 1) {
  if (P.kicks <= 0) return;
  gravAt(P.x, P.y, G0);
  const k = kickDir(); if (!k) return;
  const [dx, dy, mode] = k;
  const bt = bulletTime(), perfect = !!(bt && bt.perfect);
  if (perfect) pow *= T.perfectBoost;
  P.vx += dx * T.kick * pow; P.vy += dy * T.kick * pow;
  P.kicks--; P.kickT = 0;
  if (perfect) sfx.perfect(); else sfx.kick(Math.min(1, pow));
  if (perfect) {
    addStyle(20, `PERFECT KICK at ${bname(bt.b)}`, '#ffe08a'); toast(`✦ PERFECT KICK ✦  ${bname(bt.b)} · ×${T.perfectBoost} power`, 'gain');
    burst(P.x, P.y, '#ffe08a', 34, 260); cam.shake = Math.max(cam.shake, 6); logEv('perfect_kick', { body: bname(bt.b), pow: +pow.toFixed(2) });
    if (job && job.state === 'carry') job.perfect = (job.perfect || 0) + 1;
  }
  const ref = refBody();
  if (job && job.state === 'carry') job.kicks = (job.kicks || 0) + 1;
  logEv('kick', { mode, pow: +pow.toFixed(2), ref: bname(ref), ang: +Math.atan2(dy, dx).toFixed(2), speed: Math.hypot(P.vx, P.vy) | 0,
    tFlight: LOG.flight ? +(simT - LOG.flight.t0).toFixed(2) : null });
  if (LOG.flight) LOG.flight.kicks++;
  burst(P.x, P.y, mode === 'aim' ? '#6bc8ff' : '#ffb36b', 12, 140);
}

function respawn(msg) {
  if (LOG.flight) {
    const f = LOG.flight;
    logEv('flight_end', { reason: msg || 'reset', from: f.from, dur: +(simT - f.t0).toFixed(2), charge: f.charge,
      maxSun: f.maxSun | 0, kicks: f.kicks, heavy: +f.heavy.toFixed(2), airSteer: f.airSteer, extraSpace: f.extraSpace });
    LOG.flight = null;
  }
  if (msg) logEv('respawn', { reason: msg });
  const b = P.lastBody && bodies.includes(P.lastBody) ? P.lastBody : LEVELS[level].start();
  P.pass = null; P.chain = 0;
  P.on = b; P.anchor = null; P.anchorPick = null; P.anchorLock = false; P.ang = rand(0, TAU); P.walkV = 0; P.kicks = T.kickMax; P.kickT = 0; P.trail.length = 0;
  P.grazes.clear(); P.orbBody = null; P.orbSwept = 0;
  if (job && job.state === 'carry') { job.state = 'wait'; popup(b.x, b.y, 'parcel returned to ' + job.from.name, '#ff9c9c'); }
  if (msg) popup(b.x, b.y - b.r - 30, msg, '#ff9c9c');
}

// ---------------- seeds (build layer) ----------------
let planting = null; // {x,y,t}
// annulus (distance from the sun) that a moving body sweeps over time
function sweptBand(b) {
  if (!b.parent || b.ghost || b.seed) return null;
  if (b.parent === hub) return [b.R - b.r, b.R + b.r];
  const pr = b.parent.R;   // moon / binary member: parent orbits the sun
  return [pr - b.R - b.r, pr + b.R + b.r];
}
function seedProblem(x, y, r) {
  for (const b of bodies) if (!b.ghost && Math.hypot(b.x - x, b.y - y) < b.r + r + 30) return 'too close to ' + (bname(b) === 'rock' ? 'a rock' : bname(b));
  const sd = Math.hypot(x, y);
  if (sd > T.wallR) return 'too far out';
  for (const b of bodies) {
    const band = sweptBand(b); if (!band) continue;
    if (sd + r > band[0] - 8 && sd - r < band[1] + 8) return 'in ' + (b.name ? b.name + "'s" : "the rocks'") + ' path';
  }
  return null;
}
const seedOk = (x, y, r) => !seedProblem(x, y, r);
function plantSeed(x, y, r) {
  const s = body({ seed: true, born: simT, x, y, r: 3, targetR: r, dens: T.seedDens, color: '#7dffb0' });
  s.M = s.dens * s.r ** 3; bodies.push(s); seeds--;
  logEv('seed_plant', { r: +r.toFixed(1), x: x | 0, y: y | 0, sunDist: Math.hypot(x, y) | 0 });
  burst(x, y, '#7dffb0', 16, 90);
}
function removeSeed(s, msg) {
  const i = bodies.indexOf(s); if (i < 0) return;
  bodies.splice(i, 1); seeds++;
  logEv('seed_remove', { reason: msg, age: s.born != null ? +(simT - s.born).toFixed(1) : null });
  if (P.on === s) { P.on = null; P.vx = 0; P.vy = 0; }
  burst(s.x, s.y, '#7dffb0', 20, 150);
  if (msg) popup(s.x, s.y, msg, '#7dffb0');
}
function updateSeeds(dt) {
  for (const s of bodies) {
    if (!s.seed) continue;
    if (s.r < s.targetR) { s.r = Math.min(s.targetR, s.r + (s.targetR / T.seedGrow) * dt); s.M = s.dens * s.r ** 3; }
  }
  for (const s of bodies.slice()) {
    if (!s.seed) continue;
    for (const b of bodies) {
      if (b.seed || b.ghost) continue;
      if (Math.hypot(b.x - s.x, b.y - s.y) < b.r + s.r) { removeSeed(s, (b.name || 'a rock') + ' crushed your seed (refunded)'); break; }
    }
  }
}

// ---------------- simulation step ----------------
function step(dt) {
  simT += dt;
  placeBodies(simT);
  updateSeeds(dt);

  if (P.on) {
    const b = P.on, rr = b.r + T.playerR;
    const dir = (keys.right || keys.d ? 1 : 0) - (keys.left || keys.a ? 1 : 0);
    P.walkV += (dir * T.walk - P.walkV) * Math.min(1, dt * 12);
    P.ang += clamp(P.walkV / rr, -5, 5) * dt;
    const ux = Math.cos(P.ang), uy = Math.sin(P.ang);
    P.x = b.x + rr * ux; P.y = b.y + rr * uy;
    P.vx = b.vx - uy * P.walkV; P.vy = b.vy + ux * P.walkV;
    if (job && job.state === 'wait' && b === job.from && Math.abs(angDiff(P.ang, job.ang)) * rr < 16) {
      job.state = 'carry'; job.t0 = simT; job.style = 0;
      logEv('pickup', { at: b.name, wait: +(simT - job.tNew).toFixed(1) });
      popup(P.x, P.y, 'Got it! → ' + job.to.name, '#ffd28a');
    }
    gravAt(P.x, P.y, G0);
    return;
  }

  // free flight: real summed gravity, semi-implicit Euler (symplectic, no orbital drift)
  gravAt(P.x, P.y, G0);
  let ax = G0.ax, ay = G0.ay;
  // ANCHOR: steady tether toward one chosen world. Ramps in, bleeds off sideways/away drift.
  if (!P.anchorLock) P.anchor = chooseAnchor();
  else if (P.anchor && (!bodies.includes(P.anchor) || Math.hypot(P.anchor.x - P.x, P.anchor.y - P.y) - P.anchor.r > T.anchorRange * 1.5)) {
    popup(P.x, P.y, 'anchor slipped', '#ff9c9c'); logEv('anchor_slip', { from: bname(P.anchor) }); P.anchor = null;
  }
  P.reach = null;
  if (keys.heavy && P.anchor && !inCorona()) {
    const nb = P.anchor; P.reach = nb;
    P.reachT = Math.min(1, P.reachT + dt / T.anchorRamp);
    const dx = nb.x - P.x, dy = nb.y - P.y, d = Math.hypot(dx, dy) || 1, nx = dx / d, ny = dy / d;
    ax += T.anchorAccel * P.reachT * nx; ay += T.anchorAccel * P.reachT * ny;
    const rx = P.vx - nb.vx, ry = P.vy - nb.vy;
    const vt = -rx * ny + ry * nx;            // sideways (tangent t = (-ny, nx))
    const vr = rx * nx + ry * ny;             // >0 approaching, <0 moving away
    const k = Math.min(1, T.anchorDamp * P.reachT * dt);
    P.vx -= -ny * vt * k; P.vy -= nx * vt * k;
    if (vr < 0) { P.vx -= nx * vr * k; P.vy -= ny * vr * k; }
  } else P.reachT = 0;
  P.vx += ax * dt; P.vy += ay * dt;
  P.x += P.vx * dt; P.y += P.vy * dt;
  if (P.kicks < T.kickMax && (P.kickT += dt) >= T.kickRecharge) { P.kicks++; P.kickT = 0; }
  if (LOG.flight) { LOG.flight.maxSun = Math.max(LOG.flight.maxSun, Math.hypot(P.x, P.y)); if (keys.heavy) LOG.flight.heavy += dt; }

  for (const b of bodies) {
    if (b.ghost) continue;
    const dx = P.x - b.x, dy = P.y - b.y, d = Math.hypot(dx, dy);
    const h = d - b.r - T.playerR;
    if (h < 0 && (b === hub || b.gas)) {   // suns and gas giants can't be stood on: elastic bounce in their frame
      const nx = dx / d, ny = dy / d, vn = (P.vx - b.vx) * nx + (P.vy - b.vy) * ny;
      if (vn < 0) { P.vx -= 2 * vn * nx; P.vy -= 2 * vn * ny; }
      const spit = b === hub ? T.sunSpit : 40;
      P.vx += nx * spit; P.vy += ny * spit;   // spat out a little harder than you hit
      P.x = b.x + nx * (b.r + T.playerR); P.y = b.y + ny * (b.r + T.playerR);
      if (b === hub) { P.kicks = T.kickMax; P.kickT = 0; }   // a solar bounce refreshes your kicks
      burst(P.x, P.y, b === hub ? '#ffcf6b' : b.color, 24, 260); sfx.bounce(); popup(P.x, P.y, b === hub ? 'solar bounce!' : 'cloud-top bounce!', b === hub ? '#ffcf6b' : '#ffd9a0');
      if (simT - (P.lastBounce || -9) > 0.5) logEv(b === hub ? 'sun_bounce' : 'gas_bounce', { body: bname(b), speed: Math.hypot(P.vx, P.vy) | 0 });
      P.lastBounce = simT;
      continue;

    if (h < 0) { land(b); return; }

      ctx.strokeStyle = withAlpha(e.b.color, 0.55); ctx.lineWidth = 1.5 * px; ctx.setLineDash([3 * px, 4 * px]);

  if (P.kickCharging && !P.on) {
    ctx.strokeStyle = TH.accent2; ctx.lineWidth = 2.5 * px;

      if (sl.x < -0.15 || sl.x > 1.15 || sl.y < -0.15 || sl.y > 1.15) {   // respawn ahead of you
        if (Math.abs(sdx) > Math.abs(sdy)) { sl.x = sdx > 0 ? 1.1 : -0.1; sl.y = Math.random(); } else { sl.y = sdy > 0 ? 1.1 : -0.1; sl.x = Math.random(); }
        sl.x += rand(-0.05, 0.05); sl.y += rand(-0.05, 0.05);

  }

    for (let r = gstep; r < sysR * 1.15; r += gstep) { const [sx, sy] = w2s(hub.x + r * 0.7071, hub.y - r * 0.7071); ctx.fillText(r.toLocaleString(), sx, sy); }
  }
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');

    const [sx, sy] = w2s(tb.x, tb.y), m = 40;
    if (sx < m || sx > W - m || sy < m || sy > H - m) {
      const dx = sx - W / 2, dy = sy - H / 2, sc = Math.min((W / 2 - m) / Math.abs(dx || 1e-6), (H / 2 - m) / Math.abs(dy || 1e-6));
      const ex = W / 2 + dx * sc, ey = H / 2 + dy * sc, a = Math.atan2(dy, dx);
      ctx.save(); ctx.translate(ex, ey); ctx.rotate(a);
      ctx.fillStyle = '#ffd28a'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-6, -7); ctx.lineTo(-6, 7); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#ffd28a'; ctx.font = '11px ui-monospace,Menlo,monospace';
      ctx.fillText(tb.name, ex - Math.cos(a) * 26, ey - Math.sin(a) * 18 + 4);
    }
  }
}

function drawMinimap(tgt) {
  const R = 95, cx = W - R - 16, cy = H - R - 16, sR = systemR() * 1.08, k = R / sR;
  const m = (x, y) => [cx + (x - hub.x) * k, cy + (y - hub.y) * k];
  ctx.save();
  ctx.fillStyle = withAlpha(TH.bg, 0.82); ctx.strokeStyle = `rgba(${TH.rail},0.35)`; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, R + 6, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R + 6, 0, TAU); ctx.clip();
  for (const b of bodies) if (b.parent && b.parent === hub) {
    ctx.strokeStyle = b === tgt ? withAlpha(TH.accent, 0.5) : `rgba(${TH.rail},0.14)`;
    ctx.beginPath(); ctx.arc(cx, cy, b.R * k, 0, TAU); ctx.stroke();
  }
  if (FC.main) {
    ctx.strokeStyle = `rgba(${TH.fc},0.7)`; ctx.beginPath();
    FC.main.pts.forEach((p, i) => { const [x, y] = m(p[0], p[1]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
  }
  for (const b of bodies) {
    if (b.ghost) continue;
    const [x, y] = m(b.x, b.y);
    ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(x, y, Math.max(b === hub ? 4 : 1.8, b.r * k), 0, TAU); ctx.fill();
    if (b === tgt) { ctx.strokeStyle = '#ffd28a'; ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.stroke(); }
  }
  const [px0, py0] = m(P.x, P.y);
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(px0, py0, 3, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(207,227,255,0.45)'; ctx.font = '10px ui-monospace,Menlo,monospace'; ctx.textAlign = 'center';
  ctx.fillText('SYSTEM · M hide · Z overview', cx, cy - R - 12);
}

// ---------------- coach (live advice) ----------------
const fmt = n => isFinite(n) ? Math.round(n).toLocaleString() : '∞';
const giant = () => bodies.find(b => b.gas);
function coachText() {
  if (!job || job.state === 'done' || paused) return '';
  const tgt = currentTarget(); if (!tgt) return '';
  const osc = FC.osc, ca = FC.main && FC.main.ca, band = sweptBand(tgt) || [orbitRadiusOf(tgt), orbitRadiusOf(tgt)];
  const tR = orbitRadiusOf(tgt), g = giant(), sling = g ? `slingshot close <b>behind ${g.name}</b>` : 'use a slingshot';
  if (P.on) {
    if (P.on === tgt) return job.state === 'wait' ? `Walk <kbd>A</kbd> / <kbd>D</kbd> to the parcel ▣ on ${tgt.name}.` : '';
    if (!P.charging) return `Hold <kbd>Space</kbd> to preview your launch to <b>${tgt.name}</b> — release when the closest-approach line turns <span class="ok">green</span>.`;
    if (FC.main && !FC.main.exit) return `This jump falls back onto ${P.on.name} — hold <kbd>Space</kbd> longer for more charge.`;
    if (ca && ca.d <= T.anchorRange) return `<span class="ok">✓ Release now</span> — this launch passes ${fmt(ca.d)} from ${tgt.name} in ${ca.t.toFixed(0)}s.`;
    if (osc && osc.Ap < band[0]) return `This jump tops out at <b>Ap ${fmt(osc.Ap)}</b>; ${tgt.name} orbits at ${fmt(tR)}. Not enough energy — ${sling}, or kick <kbd>W</kbd> right after launch.`;
    if (osc && osc.Pe > band[1]) return `This launch never falls to ${tgt.name}'s orbit (Pe ${fmt(osc.Pe)}). Launch from the side where you'd jump <b>against</b> ${P.on.name}'s motion.`;
    return `Your orbit reaches ${tgt.name}'s — now it's <b>timing</b>. Keep holding; walk to change angle; release on <span class="ok">green</span> · <kbd>Esc</kbd> cancels.`;
  }
  if (P.kickCharging && FC.kick && FC.kick.ca) {
    const kc = FC.kick.ca;
    return kc.d <= T.anchorRange ? `<span class="ok">✓ Release now</span> — a ${Math.round(FC.kickPow * 100)}% kick meets ${tgt.name} in ${kc.t.toFixed(0)}s.`
      : FC.kickPow >= 1 ? `Even 100% won't meet ${tgt.name} this time round. Release anyway — you'll keep gaining every lap (watch the <b>phase</b>), and kick again once it recharges.`
      : `Charging ${Math.round(FC.kickPow * 100)}% — the dashed path passes ${fmt(kc.d)} from ${tgt.name}. Keep holding for more, release on <span class="ok">green</span> · <kbd>Esc</kbd> cancels.`;
  }
  if (P.reach === tgt) return `Landing gear on <b>${tgt.name}</b> — keep holding <kbd>Shift</kbd>.`;
  if (P.anchor === tgt) return `<span class="ok">${tgt.name} is in reach</span> — hold <kbd>Shift</kbd> to catch it.`;
  if (ca && ca.d <= T.anchorRange) return `<span class="ok">✓ On course</span> — ${tgt.name} passes ${fmt(ca.d)} away in ${ca.t.toFixed(0)}s. Hold <kbd>F</kbd> to get there sooner, <kbd>Shift</kbd> when it's ringed.`;
  const ref = refBody(), kick = P.kicks > 0 ? '' : ' (kick recharging)';
  if (ref !== hub && ref !== tgt) return `You're inside <b>${ref.name}</b>'s pull — a <kbd>W</kbd> kick here (you're fast) is extra strong${kick}.`;
  if (osc && osc.Ap < band[0]) return `Your <b>Ap ${fmt(osc.Ap)}</b> falls short of ${tgt.name} (${fmt(tR)}). Kick <kbd>W</kbd> — best at <b>Pe</b>${kick} — or ${sling}.`;
  if (osc && osc.Pe > band[1]) return `Your <b>Pe ${fmt(osc.Pe)}</b> stays above ${tgt.name} (${fmt(tR)}). Kick <kbd>S</kbd> — best at <b>Ap</b>${kick} — or pass in front of a world.`;
  const ph = FC.phase;
  if (ph && ph.closing && ph.eta < 2.5 * ph.Ty) return `${tgt.name} is ${ph.deg.toFixed(0)}° ${ph.ahead ? 'ahead' : 'behind'} on your orbit and you're closing ~${ph.lapGainDeg.toFixed(0)}°/lap — in reach in ~${fmt(ph.eta)}s. Hold <kbd>F</kbd>.`;
  if (ph && ph.ahead) return `${tgt.name} is <b>${ph.deg.toFixed(0)}° ahead</b> on your orbit. Speeding up won't catch it — a higher orbit is <i>slower</i>. <b>Slow down</b>: hold <kbd>S</kbd> + <kbd>Space</kbd>, watch the dashed path, release when it turns <span class="ok">green</span>. You'll drop lower, lap faster, and meet it${kick}.`;
  if (ph) return `${tgt.name} is <b>${ph.deg.toFixed(0)}° behind</b> you. Let it catch up: hold <kbd>W</kbd> + <kbd>Space</kbd> to rise into a slower orbit; release when the dashed path turns <span class="ok">green</span>${kick}.`;
  if (ca) return `Your orbit crosses ${tgt.name}'s but misses by <b>${fmt(ca.d)}</b> — timing. Small <kbd>W</kbd>/<kbd>S</kbd> kicks shift your arrival; watch the dashed line${kick}.`;
  return `Coasting. Hold <kbd>F</kbd> to fast-forward · <kbd>Z</kbd> for the whole system.`;
}

    <div class="title">${state}</div>
    <div class="route">${route}</div>
    <div class="pips">${Array.from({ length: T.levelGoal }, (_, i) => `<span class="${i < lvlCount ? 'on' : ''}"></span>`).join('')}</div>
    <div class="row"><span>Job ${Math.min(lvlCount + 1, T.levelGoal)} of ${T.levelGoal}${job && job.state === 'carry' ? ` · ${fmt(simT - job.t0)}s (par ${T.par})` : ''}</span><span>tip <b>${fmt(tipLeft)}s</b></span></div>
    <div class="bar"><i style="width:${(100 * tipLeft / T.tipWindow).toFixed(0)}%"></i></div>
    <div class="row" style="margin-top:8px"><span>Credits <b>${credits.toLocaleString()}</b></span><span>Seeds <b>${seeds}</b></span></div>`;
}
function instrHTML() {
  const tgt = currentTarget(), osc = FC.osc || (P.on ? null : oscOrbit()), ca = FC.main && FC.main.ca;
  const ref = P.on ? P.on : refBody(), sp = P.on ? 0 : orbitAxes(ref).speed;
  const max = systemR() * 1.05, pc = r => (100 * Math.sqrt(clamp(r / max, 0, 1))).toFixed(1);   // sqrt scale: room for inner orbits
  let gauge = '';
  if (osc && hub) {
    const band = tgt ? (sweptBand(tgt) || [orbitRadiusOf(tgt), orbitRadiusOf(tgt)]) : null;
    gauge = `<div class="gauge"><div class="track"></div>
      ${band ? `<div class="tgt" style="left:${pc(band[0])}%;width:${Math.max(0.8, pc(band[1]) - pc(band[0]))}%"></div><div class="tick" style="left:${pc((band[0] + band[1]) / 2)}%;color:var(--accent)">${tgt.name}</div>` : ''}
      <div class="band" style="left:${pc(osc.Pe)}%;width:${Math.max(0.8, pc(osc.Ap) - pc(osc.Pe))}%"></div>
      ${pc(Math.min(osc.Ap, max)) - pc(osc.Pe) < 26
        ? `<div class="tick lo" style="left:${((+pc(osc.Pe) + +pc(Math.min(osc.Ap, max))) / 2).toFixed(1)}%">Pe ${fmt(osc.Pe)} · Ap ${fmt(osc.Ap)}</div>`
        : `<div class="tick lo" style="left:${pc(osc.Pe)}%">Pe ${fmt(osc.Pe)}</div><div class="tick lo" style="left:${pc(Math.min(osc.Ap, max))}%">Ap ${fmt(osc.Ap)}</div>`}</div>`;
  }
  const reach = osc && tgt ? (() => { const b = sweptBand(tgt) || [0, 0]; return osc.Ap >= b[0] && osc.Pe <= b[1]; })() : false;
  return `<div class="hdr">${P.on ? 'Landed' : 'Flight'}<i>${P.on ? 'on ' + bname(P.on) : 'orbiting ' + bname(ref)}</i></div>
    ${osc ? `<div class="row"><span>${P.on ? 'Launch orbit (charging)' : 'Your orbit vs target'}</span><span class="${reach ? 'ok' : 'warn'}">${reach ? 'reaches ✓' : 'falls short'}</span></div>${gauge}` :
      `<div class="sub" style="margin:6px 0 8px">Hold <kbd>Space</kbd> to preview a launch orbit.</div>`}
    ${ca && !P.on || (ca && P.charging) ? `<div class="row"><span>Closest to ${ca.b.name}</span><b class="${ca.d <= T.anchorRange ? 'ok' : 'warn'}">${fmt(ca.d)} · ${ca.t.toFixed(0)}s</b></div>` : ''}
    ${FC.phase ? `<div class="row"><span>Phase to ${FC.phase.tb.name || tgt.name}</span><b class="${FC.phase.closing ? 'ok' : 'warn'}">${FC.phase.deg.toFixed(0)}° ${FC.phase.ahead ? 'ahead' : 'behind'}${FC.phase.closing && isFinite(FC.phase.eta) ? ' · ' + fmt(FC.phase.eta) + 's' : ''}</b></div>` : ''}
    <div class="row"><span>Speed</span><b>${fmt(sp)}</b></div>
    <div class="row"><span>Kicks</span><span>${Array.from({ length: T.kickMax }, (_, i) => `<span style="color:${i < P.kicks ? 'var(--warn)' : 'var(--faint)'}">●</span>`).join(' ')}${P.kicks < T.kickMax && !P.on ? ` <span class="sub">${(T.kickRecharge - P.kickT).toFixed(0)}s</span>` : ''}</span></div>
    <div class="row"><span>${LEVELS[level].assistT && !assist ? 'Landing gear' : 'Anchor'}</span><b class="${P.reach ? 'ok' : ''}">${P.anchor ? bname(P.anchor) + (P.reach ? ' · pulling' : '') : 'none in ' + fmt(T.anchorRange)}</b></div>
    ${warp > 1.05 ? `<div class="row"><span class="warn">▶▶ warp ×${warp.toFixed(1)}</span><span class="sub">auto-brakes before action</span></div>` : ''}`;
}
function keysHTML() {
  const k = (a, b) => `<div class="k"><span>${a}</span><span>${b}</span></div>`;
  const gear = LEVELS[level].assistT && !assist ? 'landing gear' : 'anchor';
  let h = (P.charging || P.kickCharging) ? k('<kbd>Esc</kbd>', `<span class="warn">cancel ${P.charging ? 'jump' : 'kick'}</span>`) : '';
  h += P.on ? k('<kbd>A</kbd><kbd>D</kbd>', 'walk') + k('<kbd>Space</kbd> hold', 'charge + preview') + k('release', 'jump')
    : k('<kbd>Space</kbd> hold', 'kick (longer = stronger)') + k('+<kbd>W</kbd> / <kbd>S</kbd>', 'prograde / retro') + k('+<kbd>A</kbd> / <kbd>D</kbd>', 'radial in / out') +
      k('+arrows', 'screen aim') + k('<kbd>Shift</kbd> hold', `${gear} (${fmt(T.anchorRange)})`) + k('<kbd>Q</kbd>', 'switch catch target') + k('<kbd>F</kbd> hold', 'warp ×8 (auto-brakes)');
  h += '<div class="sep"></div>' + k('<kbd>B</kbd>', 'Flight School') + k('<kbd>Z</kbd> · <kbd>M</kbd>', 'overview · map') + k('<kbd>T</kbd>', 'theme: ' + TH.name) + k('<kbd>N</kbd>', SND.on ? 'sound on' : 'sound muted');
  if (keysFull) h += k('<kbd>P</kbd>', 'forecast') + k('<kbd>V</kbd>', 'frame target') + k('<kbd>C</kbd>', 'camera spin') + k('<kbd>G</kbd>', 'assist (L2)') +
    k('click+hold', 'plant seed') + k('right-click', 'dig seed') + k('<kbd>X</kbd>', 'respawn') + k('wheel', 'zoom') + k('<kbd>L</kbd>', 'download log');
  h += k('<kbd>H</kbd>', keysFull ? 'fewer keys' : 'all keys');
  return `<div class="hdr">Controls<i>${P.on ? 'ground' : 'flight'}</i></div>${h}<div class="sep"></div><div class="sub" style="font-size:10px">● log ${LOG.status} · <kbd>L</kbd> download</div>`;
}
let hudT = 0;
function updateHud() {
  missionEl.innerHTML = missionHTML();
  instrEl.innerHTML = instrHTML();
  keysEl.innerHTML = keysHTML();
  let c = coachText();
  if (BT && !paused) c = BT.perfect
    ? `<span class="tag">SLINGSHOT</span><b style="color:#ffe08a">✦ PERFECT WINDOW ✦</b> — kick now (<kbd>W</kbd> + <kbd>Space</kbd>) for ×${T.perfectBoost} power at ${bname(BT.b)}`
    : `<span class="tag">SLINGSHOT</span>Bottom of the pass at <b>${bname(BT.b)}</b> — the perfect window is coming…`;
  if (warp > 1.25 && !paused && !BT) {
    const ne = nextEvent(), sp = Math.round(Math.hypot(P.vx, P.vy));
    c = `<span class="tag">WARP</span><span class="warpnum">×${warp.toFixed(1)}</span><span class="num">${sp} px/s</span>` +
        (ne ? ` <span class="sub">· ${ne.label} in ${fmt(ne.t)}s</span>` : '');
  }
  coachEl.innerHTML = c ? (c.includes('class="tag"') ? c : `<span class="tag">COACH</span>${c}`) : '';
  coachEl.style.display = c ? 'block' : 'none';
}

// ---------------- level flow ----------------
let panelAction = null, levelT0 = 0;
const panelEl = document.getElementById('done');
const panelOpen = () => panelEl.style.display === 'block';
function showPanel(html, action) { panelEl.innerHTML = html; panelEl.style.display = 'block'; panelAction = action; paused = true; }
function hidePanel() { panelEl.style.display = 'none'; panelAction = null; paused = false; guideIdx = null; }
function startLevel(n) {
  level = n; applyTuning(n); LEVELS[n].build(); finishBodies(); placeBodies(simT);
  lvlCount = 0; levelDone = false; levelT0 = simT; job = null; jobTimer = 0; levelStars = 0;
  buildDust();
  P.lastBody = LEVELS[n].start(); respawn(); P.ang = -Math.PI / 2; P.trail.length = 0;
  step(0); P.Eprev = helioE();
  newJob();
  cam.x = P.x; cam.y = P.y;
  LOG.meta.bodies = bodies.filter(b => !b.ghost).map(b => ({ name: bname(b), r: b.r, M: b.M, R: b.R, parent: bname(b.parent), gas: b.gas }));
  logEv('level_start', { level: n, assist });
  if (n === 1) { popup(P.x, P.y - 60, LEVELS[n].intro, '#ffd28a'); toast('Press B any time for Flight School'); }
  else showGuide(0);
}

// ---------------- main loop ----------------
LOG.meta.sampleCols = ['t', 'x', 'y', 'vx', 'vy', 'on', 'dom', 'heavy', 'zoom', 'camRot', 'anchor', 'pulling', 'warp'];
let last = performance.now(), acc = 0;
{ const ut = new URLSearchParams(location.search || '').get('theme'); if (ut && THEMES[ut]) themeName = ut; }
setTheme(themeName);
const urlLevel = +new URLSearchParams(location.search || '').get('level') || 1;
startLevel(LEVELS[urlLevel] ? urlLevel : 1);
let sampleT = 0, flushT = 5, frameDt = 1 / 60;
function frame(now) {
  const rawMs = now - last;
  const dt = Math.min(0.05, rawMs / 1000); last = now;
  LOG.perf.frames++; if (rawMs > 25) LOG.perf.hitches++; if (rawMs > LOG.perf.worstMs && LOG.perf.frames > 30) LOG.perf.worstMs = rawMs | 0;
  for (const ts of pendingInputTs) if (LOG.perf.inputLatMs.length < 2000) LOG.perf.inputLatMs.push(Math.round(now - ts));
  pendingInputTs.length = 0;
  if ((sampleT -= dt) <= 0) {
    sampleT = 0.1;
    LOG.samples.push([+simT.toFixed(2), P.x | 0, P.y | 0, P.vx | 0, P.vy | 0, bname(P.on), bname(G0.dom),
      keys.heavy ? 1 : 0, +cam.zoom.toFixed(2), +cam.rot.toFixed(2), bname(P.anchor), P.reach ? 1 : 0, +warp.toFixed(1)]);
  }
  if ((flushT -= dt) <= 0) { flushT = 5; flushLog(false); }
  if (!paused) {   // charging runs on real time, so warp never rushes your aim
    if (P.on && P.charging) { if (P.charge >= 1) P.fullHold += dt; P.charge = Math.min(1, P.charge + dt / T.chargeTime); }
    if (P.kickCharging && !P.on) P.kickCharge = Math.min(1, P.kickCharge + dt / T.kickChargeTime);
  }
  const nev = paused ? null : nextEvent();
  BT = bulletTime();
  if (BT && !paused) { P.pass.bt = (P.pass.bt || 0) + dt; if (BT.perfect && !P.pass.chimed) { P.pass.chimed = true; sfx.window(); } }
  btAmt += ((BT ? 1 : 0) - btAmt) * (1 - Math.exp(-dt * (BT ? 6 : 4)));
  const cap = P.charging || P.kickCharging || P.reach || BT ? 1 : clamp((nev ? nev.t : Infinity) / T.warpLead, 1, T.warpMax);
  const want = keys.ff && !paused ? cap : 1;
  warp += (want - warp) * (1 - Math.exp(-dt * (want > warp ? 1.5 : 7)));   // ramp up gently, brake hard
  if (warp < 1.01 && want === 1) warp = 1;
  if (keys.ff && nev && warp > 2 && cap < 2.2 && !braked) { braked = true; toast('▶ ' + nev.label, 'gain'); sfx.brake(); logEv('warp_slow', { label: nev.label }); }
  if (cap > 4) braked = false;
  frameDt = dt;
  if (paused) acc = 0; else acc += dt * warp * lerp(1, T.btScale, btAmt);   // bullet-time slows the sim
  while (acc >= T.step) { step(T.step); acc -= T.step; }
  if (planting) planting.t += dt;
  if (!paused && job && job.state === 'done') { jobTimer -= dt; if (jobTimer <= 0) { newJob(); popup(P.x, P.y, `New job: ${job.from.name} → ${job.to.name}`, '#ffd28a'); } }
  const E = helioE(), rawGain = P.on || paused || !dt ? 0 : (E - P.Eprev) / dt / Math.max(50, Math.hypot(P.vx, P.vy));
  P.Eprev = E; P.gainS = (P.gainS || 0) + (rawGain - (P.gainS || 0)) * Math.min(1, dt * 8);   // smoothed
  const gain = P.gainS;
  if (!paused) { P.trail.push([P.x, P.y, gain]); if (P.trail.length > 320) P.trail.shift(); }
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  for (let i = particles.length - 1; i >= 0; i--) if (particles[i].life <= 0) particles.splice(i, 1);
  for (const p of popups) p.t += dt;
  for (let i = popups.length - 1; i >= 0; i--) if (popups[i].t > 2.2) popups.splice(i, 1);
  cam.shake *= Math.exp(-dt * 9); if (cam.shake < 0.05) cam.shake = 0;
  updateAudio();
  updateCamera(dt);
  updateForecast();
  draw();
  if ((hudT -= dt) <= 0) { updateHud(); hudT = 0.1; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
